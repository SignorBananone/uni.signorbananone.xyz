    &lt;figcaption&gt;Muovi il cursore. I punti blu sono i 18 paesi della slide 13 (passa sopra per i dati); la linea nera è una curva logaritmica illustrativa adattata alla forma del grafico della slide 14, non una stima ufficiale. Il segmento arancio è la pendenza: guarda come si appiattisce.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Perché la curva è concava?&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;Nei paesi poveri un po’ di reddito in più compra cose che salvano vite subito: cibo, acqua pulita, vaccini, cure di base. Nei paesi ricchi quei bisogni sono già coperti e ogni dollaro in più “compra” sempre meno anni. Questo è il principio dei &lt;b&gt;rendimenti decrescenti&lt;/b&gt;.&lt;/p&gt;
    &lt;p&gt;Conseguenza per la stratificazione: &lt;b&gt;redistribuire&lt;/b&gt; risorse dai ricchi ai poveri (fra paesi o dentro un paese) può aumentare la salute media complessiva, perché ciò che perde chi sta in alto è poco rispetto a ciò che guadagna chi sta in basso.&lt;/p&gt;
    &lt;p&gt;Anche i punti fuori dalla curva sono interessanti: gli USA (79,5 anni con quasi 60.000 $) stanno &lt;i&gt;sotto&lt;/i&gt; la curva rispetto a paesi europei più poveri. Questo ci porta alla Parte 5: conta anche come il reddito è distribuito.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;
  &lt;div class=&quot;ext&quot;&gt;Samuel H. Preston pubblicò la curva nel 1975 (“The changing relation between mortality and level of economic development”, &lt;i&gt;Population Studies&lt;/i&gt;). Osservò che la curva si sposta &lt;b&gt;verso l’alto&lt;/b&gt; nel tempo: a parità di reddito si vive più a lungo grazie al progresso medico e sanitario; secondo le sue stime solo una piccola parte dell’aumento della vita attesa fra gli anni ’30 e ’60 si spiega con la crescita del reddito. Preston la presentava come associazione, non come rapporto causale. L’articolo è stato ristampato nel &lt;i&gt;Bulletin of the WHO&lt;/i&gt; (2003). &lt;a href=&quot;https://scielosp.org/article/bwho/2003.v81n11/831-832&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bulletin of the WHO, “Public health classic”&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Quanto è potente il tuo passaporto?&lt;/h3&gt;
  &lt;p&gt;La cittadinanza è uno &lt;span class=&quot;en&quot;&gt;ascribed status&lt;/span&gt; (status ascritto: assegnato alla nascita, non conquistato) che media un accesso molto diseguale a tenore di vita, sicurezza e opportunità (slide 21, vedi &lt;a href=&quot;#s4&quot;&gt;Parte 4&lt;/a&gt;). Il passaporto ne è la misura più concreta.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Henley Passport Index&lt;/b&gt;&lt;br&gt;classifica tutti i passaporti del mondo per &lt;b&gt;numero di destinazioni&lt;/b&gt; raggiungibili senza visto da chiedere in anticipo. Si basa su dati della IATA (&lt;i&gt;International Air Transport Association&lt;/i&gt;; la slide scrive “Authority”).&lt;/div&gt;
      &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Henley Passport Power score&lt;/b&gt;&lt;br&gt;combina l’indice con i dati sul PIL della Banca Mondiale: quanta parte dell’economia mondiale è accessibile senza visto. Mostra una &lt;b&gt;disuguaglianza economica crescente&lt;/b&gt; fra paesi.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;h4&gt;I più deboli (slide 25)&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;Nigeria&lt;/b&gt;: 44 destinazioni (20% del mondo), pari ad appena l’&lt;b&gt;1,5% del PIL globale&lt;/b&gt;.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Afghanistan&lt;/b&gt;: ultimo nel Power score, 24 paesi e meno dell’1% del PIL mondiale.&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;Iraq&lt;/b&gt; (29) e &lt;b&gt;Syria&lt;/b&gt; (26).&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p&gt;Questi cittadini sono &lt;i&gt;shut out of many opportunities for economic mobility and growth&lt;/i&gt;: esclusi da opportunità di studio, lavoro e commercio.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 800 350&quot; id=&quot;passbars&quot; role=&quot;img&quot; aria-label=&quot;Destinazioni visa-free per passaporto&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Destinazioni accessibili senza visto. Dati delle slide 24–25 (classifica 2026); la barra arancio degli USA viene dalla fonte esterna CNN citata nella slide 24.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Ottobre 2025: per la prima volta in 20 anni gli &lt;b&gt;Stati Uniti escono dalla top 10&lt;/b&gt; dell’Henley Index, scendendo al 12° posto insieme alla Malaysia con 180 destinazioni. Tra le cause: il Brasile ha reintrodotto il visto per i cittadini USA per mancata reciprocità, e le nuove esenzioni cinesi non includono gli USA. &lt;a href=&quot;https://ktvz.com/entertainment/cnn-style/2025/10/14/us-drops-out-of-worlds-most-powerful-passport-top-10-list-for-the-first-time/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CNN (ripreso da KTVZ)&lt;/a&gt;&lt;/div&gt;
  &lt;div class=&quot;ext&quot;&gt;Metodo dell’indice: per ogni destinazione il passaporto ottiene 1 se non serve visto o se basta un visto all’arrivo, un permesso di ingresso o un’autorizzazione elettronica (ETA); ottiene 0 se serve un visto o un e‑Visa da chiedere prima della partenza. Copre 199 passaporti e 227 destinazioni ed è aggiornato ogni mese. &lt;a href=&quot;https://www.henleyglobal.com/passport-index/methodology&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Henley &amp;amp; Partners · Methodology&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 3&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Che cosa misura il GDP per capita PPP e perché si usa la PPP?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Il PIL per abitante corretto per la parità di potere d’acquisto: tiene conto dei prezzi diversi nei vari paesi, così i redditi diventano confrontabili in termini di beni effettivamente acquistabili.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Descrivi la forma della Preston curve e la sua implicazione.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;È concava: la vita attesa cresce molto con il reddito nei paesi poveri e poco in quelli ricchi (rendimenti decrescenti). Quindi lo stesso aumento di reddito “vale” molti più anni di vita in un paese povero.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Perché la cittadinanza è un esempio di ascribed status?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché la si riceve alla nascita (per luogo o discendenza), senza merito né scelta, eppure condiziona fortemente l’accesso a tenore di vita, sicurezza e mobilità, come mostra il passport index.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Che cosa aggiunge il Passport Power score rispetto al semplice conteggio delle destinazioni?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Pesa le destinazioni con il loro PIL (dati World Bank): non conta solo quanti paesi puoi visitare, ma quanta parte dell’economia mondiale ti è accessibile. Es. Nigeria: 44 paesi ma solo l’1,5% del PIL globale.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s4&quot; class=&quot;part p-mattone&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Parte 4 &lt;span class=&quot;slides&quot;&gt;· slide 16–21&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;en&quot;&gt;Social class&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;social status&lt;/span&gt;&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Come ordiniamo individui e gruppi dentro una società? Con due strumenti complementari: la &lt;b&gt;classe&lt;/b&gt;, una gerarchia basata sull’&lt;i&gt;occupation&lt;/i&gt; (occupazione), e lo &lt;b&gt;status&lt;/b&gt;, una gerarchia di prestigio e rispetto.&lt;/p&gt;

  &lt;div class=&quot;tabs&quot;&gt;
    &lt;div role=&quot;tablist&quot;&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;true&quot;&gt;Marx &amp;amp; Engels&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Erikson &amp;amp; Goldthorpe&lt;/button&gt;
      &lt;button role=&quot;tab&quot; aria-selected=&quot;false&quot;&gt;Confronto&lt;/button&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot;&gt;
      &lt;div class=&quot;grid2&quot;&gt;
        &lt;div&gt;
          &lt;p&gt;Nell’Ottocento dell’industrializzazione, &lt;b&gt;Karl Marx e Friedrich Engels&lt;/b&gt; vedono &lt;b&gt;due classi&lt;/b&gt;: i &lt;span class=&quot;en&quot;&gt;capitalists&lt;/span&gt;, che possiedono fabbriche e macchine (il &lt;i&gt;capital&lt;/i&gt;, i mezzi di produzione), e i &lt;span class=&quot;en&quot;&gt;laborers&lt;/span&gt;, che lavorano per loro in cambio di un salario basso.&lt;/p&gt;
          &lt;p&gt;L’industrializzazione arriva insieme a una distribuzione molto diseguale: i capitalisti hanno posizioni di classe più favorevoli. Il criterio è la &lt;b&gt;proprietà&lt;/b&gt;: possiedi o no i mezzi di produzione?&lt;/p&gt;
        &lt;/div&gt;
        &lt;svg viewBox=&quot;0 0 300 220&quot; role=&quot;img&quot; aria-label=&quot;Modello a due classi&quot;&gt;
          &lt;rect x=&quot;70&quot; y=&quot;20&quot; width=&quot;160&quot; height=&quot;55&quot; rx=&quot;10&quot; class=&quot;fma&quot;/&gt;
          &lt;text x=&quot;150&quot; y=&quot;44&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;fp&quot;&gt;Capitalists&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;63&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fp&quot;&gt;possiedono il capitale&lt;/text&gt;
          &lt;rect x=&quot;20&quot; y=&quot;145&quot; width=&quot;260&quot; height=&quot;55&quot; rx=&quot;10&quot; class=&quot;fmab sma&quot;/&gt;
          &lt;text x=&quot;150&quot; y=&quot;169&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot; class=&quot;fma&quot;&gt;Laborers&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;188&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;vendono il proprio lavoro&lt;/text&gt;
          &lt;path d=&quot;M110,140 V82&quot; class=&quot;sma&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a1)&quot;/&gt;&lt;text x=&quot;104&quot; y=&quot;115&quot; text-anchor=&quot;end&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;lavoro&lt;/text&gt;
          &lt;path d=&quot;M190,82 V140&quot; class=&quot;sma&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#a1)&quot;/&gt;&lt;text x=&quot;196&quot; y=&quot;115&quot; font-size=&quot;11&quot; class=&quot;fi&quot;&gt;salario basso&lt;/text&gt;
        &lt;/svg&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;p&gt;&lt;b&gt;Robert Erikson e John Goldthorpe&lt;/b&gt; propongono &lt;b&gt;molte classi&lt;/b&gt;, definite come &lt;i&gt;aggregates of social positions identified in terms of relationships within labor markets and production units&lt;/i&gt;: insiemi di posizioni definite dai rapporti nel mercato del lavoro e nelle unità produttive (sei dipendente o datore? con quale contratto, autonomia, prospettive di carriera?).&lt;/p&gt;
      &lt;p&gt;Qui l’&lt;b&gt;occupation&lt;/b&gt; è l’elemento chiave per accedere ai valuable goods. Da qui la conclusione della slide 17: &lt;b&gt;la classe sociale è associata a benessere, tenore di vita e salute&lt;/b&gt;.&lt;/p&gt;
      &lt;div class=&quot;extra&quot;&gt;Lo schema è noto come &lt;b&gt;EGP&lt;/b&gt; (Erikson‑Goldthorpe‑Portocarero) e distingue, nella versione estesa, una decina di classi: dalla &lt;i&gt;service class&lt;/i&gt; (professionisti e dirigenti) agli impiegati di routine, ai piccoli imprenditori, agli operai qualificati e non qualificati, ai lavoratori agricoli. È lo schema più usato in Europa per gli studi di mobilità.&lt;/div&gt;
    &lt;/div&gt;
    &lt;div role=&quot;tabpanel&quot; hidden&gt;
      &lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;Marx &amp;amp; Engels&lt;/th&gt;&lt;th&gt;Erikson &amp;amp; Goldthorpe&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;Quante classi&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;molte&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Criterio&lt;/td&gt;&lt;td&gt;proprietà dei mezzi di produzione&lt;/td&gt;&lt;td&gt;relazioni nel mercato del lavoro e nelle unità produttive (occupation)&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Contesto&lt;/td&gt;&lt;td&gt;prima industrializzazione&lt;/td&gt;&lt;td&gt;società industriali avanzate, ceto medio ampio&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;Uso&lt;/td&gt;&lt;td&gt;spiegare conflitto e sfruttamento&lt;/td&gt;&lt;td&gt;misurare disuguaglianze e mobilità&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;La classe si vede nella durata della vita&lt;/h3&gt;
  &lt;p&gt;Inghilterra e Galles, 1997‑99 (slide 18): la speranza di vita scende con regolarità scendendo la scala delle classi occupazionali, per uomini e donne.&lt;/p&gt;
  &lt;div class=&quot;btnrow&quot; id=&quot;lebtn&quot;&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;true&quot; data-m=&quot;m&quot;&gt;Males&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-m=&quot;f&quot;&gt;Females&lt;/button&gt;
    &lt;button class=&quot;btn&quot; aria-pressed=&quot;false&quot; data-m=&quot;b&quot;&gt;Entrambi&lt;/button&gt;
  &lt;/div&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 760 285&quot; id=&quot;lebars&quot; role=&quot;img&quot; aria-label=&quot;Speranza di vita per classe sociale&quot;&gt;&lt;/svg&gt;
    &lt;figcaption id=&quot;legap&quot;&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Esempi di occupazione per ogni classe&lt;/summary&gt;&lt;div&gt;
    &lt;p&gt;&lt;b&gt;Professional&lt;/b&gt;: doctors, engineers · &lt;b&gt;Managerial &amp;amp; technical / intermediate&lt;/b&gt;: managers, school teachers · &lt;b&gt;Skilled non‑manual&lt;/b&gt;: clerks, cashiers · &lt;b&gt;Skilled manual&lt;/b&gt;: plumbers, electricians · &lt;b&gt;Partly skilled&lt;/b&gt;: warehousemen, security guards · &lt;b&gt;Unskilled&lt;/b&gt;: cleaners, messengers.&lt;/p&gt;
    &lt;p class=&quot;small muted&quot;&gt;Il gradiente è “a scalini”: non c’è solo una differenza fra i più poveri e tutti gli altri, ogni gradino conta. Le donne &lt;i&gt;unskilled&lt;/i&gt; (77,1) vivono quasi quanto gli uomini &lt;i&gt;professional&lt;/i&gt; (78,5): genere e classe agiscono insieme, un esempio di intersezione.&lt;/p&gt;
  &lt;/div&gt;&lt;/details&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Social status&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La classe non cattura tutte le basi della stratificazione. Serve anche lo &lt;b&gt;status&lt;/b&gt;:&lt;/p&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Social status&lt;/b&gt;&lt;br&gt;un &lt;b&gt;subjective ranking&lt;/b&gt; (graduatoria soggettiva) di individui o gruppi in termini di &lt;i&gt;honor, esteem and respect&lt;/i&gt; — onore, stima e rispetto. Può basarsi su gruppi etnici, istruzione, età, (genere): es. l’idea che “i bianchi abbiano più prestigio dei neri” o che “gli uomini debbano essere più rispettati delle donne”.&lt;/div&gt;
  &lt;div class=&quot;extra&quot;&gt;La distinzione classe/status risale a &lt;b&gt;Max Weber&lt;/b&gt;: la classe riguarda la posizione nel mercato, lo status il prestigio sociale riconosciuto. Le slide la applicano senza nominarlo.&lt;/div&gt;

  &lt;h4&gt;&lt;span class=&quot;en&quot;&gt;Occupational prestige&lt;/span&gt;: gli USA nel 1989&lt;/h4&gt;
  &lt;p&gt;Una forma misurabile di status è il prestigio delle professioni, ottenuto chiedendo a campioni di persone di valutare i mestieri su una scala (qui 0‑100).&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 300&quot; id=&quot;prestbars&quot; role=&quot;img&quot; aria-label=&quot;Prestige score top 5 e lowest 5&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Top‑5 e lowest‑5 della slide 20. Fonte nelle slide: Nakao &amp;amp; Treas, 1994.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Keiko Nakao e Judith Treas, “Updating Occupational Prestige and Socioeconomic Scores: How the New Measures Measure Up”, &lt;i&gt;Sociological Methodology&lt;/i&gt; 24 (1994): 1‑72. Nel &lt;i&gt;General Social Survey&lt;/i&gt; del 1989 gli intervistati ordinavano le professioni su una “scala” di 9 gradini di &lt;i&gt;social standing&lt;/i&gt;; i giudizi sono stati convertiti in punteggi 0‑100. &lt;a href=&quot;https://usa.ipums.org/usa-action/variables/PRENT&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IPUMS USA · variabile PRENT&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;Status e &lt;span class=&quot;en&quot;&gt;development outcomes&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Lo status non è solo “reputazione”: è un &lt;b&gt;meccanismo&lt;/b&gt; che riproduce e struttura la disuguaglianza (slide 21). Apri le schede:&lt;/p&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Nel mercato del lavoro e nella scuola&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Classificazioni di classe o etniche filtrano l’accesso al lavoro nei &lt;span class=&quot;en&quot;&gt;segmented labour markets&lt;/span&gt; (mercati del lavoro divisi in segmenti — buoni e cattivi lavori — fra cui è difficile passare), alle reti sociali e alle chance nel sistema educativo.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Fra paesi&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Lo &lt;b&gt;status dei paesi&lt;/b&gt; come &lt;i&gt;developed&lt;/i&gt; o &lt;i&gt;developing&lt;/i&gt; può tradursi in accesso diseguale alle posizioni nelle organizzazioni internazionali.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;Per le élite globali&lt;/summary&gt;&lt;div&gt;&lt;p&gt;L’accesso a posizioni di vertice nelle corporation transnazionali permette alle &lt;i&gt;global economic elites&lt;/i&gt; di stabilizzare la propria posizione di classe.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;acc&quot;&gt;&lt;summary&gt;La cittadinanza&lt;/summary&gt;&lt;div&gt;&lt;p&gt;“&lt;i&gt;Very importantly&lt;/i&gt;”: la cittadinanza nazionale è uno &lt;b&gt;ascribed status&lt;/b&gt; che media un accesso molto diseguale a tenore di vita, sicurezza e molto altro. → Vedi il &lt;a href=&quot;#s3&quot;&gt;passport index&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 4&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Su cosa si basa la classe sociale secondo le slide?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;È una gerarchia basata sull’occupazione (per Marx ed Engels, più precisamente sulla proprietà o meno del capitale).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. In cosa differiscono Marx‑Engels ed Erikson‑Goldthorpe?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Marx ed Engels vedono due classi (capitalisti e lavoratori) definite dalla proprietà; Erikson e Goldthorpe vedono molte classi definite dalle relazioni nel mercato del lavoro e nelle unità produttive, con l’occupazione come chiave per accedere ai valuable goods.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. Quanto è ampio il gap di vita attesa fra professional e unskilled (UK 1997‑99)?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;7,4 anni per gli uomini (78,5 vs 71,1) e 5,7 per le donne (82,8 vs 77,1).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Cos’è lo status e perché è “soggettivo”?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;È una graduatoria per onore, stima e rispetto. È soggettivo perché dipende dai giudizi e dalle credenze condivise in una società (es. prestigio professionale, stereotipi etnici o di genere), non da una risorsa materiale misurabile come il reddito.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;5. Fai un esempio di come lo status produce development outcomes diseguali.&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Es. la cittadinanza (ascribed status) determina la libertà di movimento e quindi l’accesso a lavoro e studio all’estero; oppure le classificazioni etniche che filtrano l’accesso a mercati del lavoro segmentati.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;s5&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Parte 5 &lt;span class=&quot;slides&quot;&gt;· slide 26–32&lt;/span&gt;&lt;/div&gt;
  &lt;h2&gt;&lt;span class=&quot;en&quot;&gt;Income&lt;/span&gt; e &lt;span class=&quot;en&quot;&gt;wealth&lt;/span&gt;: quanto è ripida la scala?&lt;/h2&gt;
  &lt;p class=&quot;lead&quot;&gt;Individui e gruppi si possono ordinare su una &lt;span class=&quot;en&quot;&gt;social ladder&lt;/span&gt; (scala sociale) soprattutto rispetto a reddito e ricchezza. La domanda della slide 26 è: &lt;i&gt;qual è il grado di stratificazione&lt;/i&gt; rispetto a questo bene?&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Income&lt;/b&gt; (reddito)&lt;br&gt;un &lt;b&gt;flusso&lt;/b&gt;: quanto entra in un periodo (salari, pensioni, affitti, interessi).&lt;/div&gt;
    &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Wealth&lt;/b&gt; (ricchezza)&lt;br&gt;uno &lt;b&gt;stock&lt;/b&gt;: quanto si possiede in un momento (case, risparmi, azioni, imprese, meno i debiti). È di solito molto più concentrata del reddito.&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot;&gt;Distinzione flusso/stock: integrazione del riassunto, le slide usano i due termini insieme.&lt;/p&gt;

  &lt;h3&gt;The &lt;span class=&quot;en&quot;&gt;Gini coefficient&lt;/span&gt;&lt;/h3&gt;
  &lt;div class=&quot;def&quot;&gt;&lt;b&gt;Gini coefficient&lt;/b&gt;&lt;br&gt;riassume in un solo numero la &lt;b&gt;overall stratification&lt;/b&gt; (stratificazione complessiva) del reddito o della ricchezza in una società. Range &lt;b&gt;0 – 100&lt;/b&gt;: &lt;b&gt;0&lt;/b&gt; = tutti hanno lo stesso reddito; &lt;b&gt;100&lt;/b&gt; = tutto è nelle mani di una sola persona.&lt;/div&gt;
  &lt;p&gt;Per capire da dove esce il numero serve la &lt;span class=&quot;en&quot;&gt;Lorenz curve&lt;/span&gt; (curva di Lorenz): si mettono in fila le persone dalla più povera alla più ricca e si disegna, per ogni quota di popolazione, la quota di reddito totale che possiede. Con perfetta uguaglianza la curva è la diagonale; più la curva “pende” in basso, più c’è disuguaglianza.&lt;/p&gt;
  &lt;div class=&quot;def&quot; style=&quot;font-family:var(--serif);font-size:1.1rem&quot;&gt;G = &lt;span style=&quot;display:inline-block;text-align:center;vertical-align:middle&quot;&gt;&lt;span style=&quot;display:block;border-bottom:1px solid currentColor;padding:0 .3rem&quot;&gt;area fra diagonale e curva di Lorenz&lt;/span&gt;&lt;span style=&quot;display:block;padding:0 .3rem&quot;&gt;area totale sotto la diagonale&lt;/span&gt;&lt;/span&gt; × 100&lt;/div&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 340 320&quot; id=&quot;lorenz&quot; role=&quot;img&quot; aria-label=&quot;Curva di Lorenz interattiva&quot;&gt;
        &lt;rect x=&quot;50&quot; y=&quot;20&quot; width=&quot;260&quot; height=&quot;260&quot; class=&quot;fcard sr&quot;/&gt;
        &lt;path id=&quot;lzarea&quot; class=&quot;ft&quot; fill-opacity=&quot;.22&quot;/&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;280&quot; x2=&quot;310&quot; y2=&quot;20&quot; class=&quot;sm&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
        &lt;path id=&quot;lzcurve&quot; fill=&quot;none&quot; class=&quot;st&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;circle id=&quot;lzmk&quot; r=&quot;5&quot; class=&quot;ft&quot;/&gt;
        &lt;text x=&quot;180&quot; y=&quot;305&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;fi&quot;&gt;quota cumulata di popolazione (dal più povero) →&lt;/text&gt;
        &lt;text x=&quot;20&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; class=&quot;fi&quot; transform=&quot;rotate(-90 20 150)&quot;&gt;quota cumulata di reddito →&lt;/text&gt;
        &lt;text x=&quot;200&quot; y=&quot;110&quot; font-size=&quot;11&quot; class=&quot;fm&quot; transform=&quot;rotate(-45 200 110)&quot;&gt;perfetta uguaglianza&lt;/text&gt;
        &lt;g font-size=&quot;10&quot; class=&quot;fm&quot;&gt;&lt;text x=&quot;46&quot; y=&quot;292&quot; text-anchor=&quot;end&quot;&gt;0&lt;/text&gt;&lt;text x=&quot;310&quot; y=&quot;294&quot; text-anchor=&quot;middle&quot;&gt;100%&lt;/text&gt;&lt;text x=&quot;44&quot; y=&quot;24&quot; text-anchor=&quot;end&quot;&gt;100%&lt;/text&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;label for=&quot;lzk&quot; class=&quot;small&quot;&gt;Concentrazione del reddito&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;lzk&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;30&quot;&gt;
      &lt;div class=&quot;readout&quot;&gt;&lt;span&gt;Gini &lt;b id=&quot;lzg&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;il 10% più ricco ha &lt;b id=&quot;lzt&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;span&gt;la metà più povera ha &lt;b id=&quot;lzb&quot;&gt;&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;p class=&quot;card small&quot;&gt;Ordine di grandezza: &lt;span id=&quot;lzref&quot;&gt;&lt;/span&gt;.&lt;/p&gt;
      &lt;p class=&quot;small&quot;&gt;L’esempio della slide 27 — &lt;i&gt;il 10% della popolazione ha il 40% del reddito totale&lt;/i&gt; — indica stratificazione del reddito: con distribuzione uguale quel 10% avrebbe il 10%. Il punto arancio è la curva all’altezza del 90° percentile: la distanza verticale fra lì e il 100% è la quota del 10% più ricco. Nel modello giocattolo arrivare al 40% richiede un Gini molto alto; le curve reali, che “piegano” soprattutto in cima, ci arrivano con Gini più bassi.&lt;/p&gt;
      &lt;p class=&quot;small muted&quot;&gt;Modello giocattolo: curva L(p) = p&lt;sup&gt;k&lt;/sup&gt;, per cui G = (k−1)/(k+1). Le curve reali hanno forme diverse.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;&lt;span class=&quot;en&quot;&gt;Income stratification&lt;/span&gt; nel mondo&lt;/h3&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 680 470&quot; id=&quot;ginibars&quot; role=&quot;img&quot; aria-label=&quot;Coefficienti di Gini per paese&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;Coefficienti di Gini dalla slide 28 (World Bank 2017b), ordinati. Gli anni di rilevazione variano dal 2008 al 2016 (es. Italia 35,4 nel 2015, Sudafrica 63,0 nel 2014). L’Europa del Nord sta in basso, America Latina e Sudafrica in alto, gli USA sopra tutti i grandi paesi europei.&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;ext&quot;&gt;Nella banca dati della Banca Mondiale (serie &lt;i&gt;SI.POV.GINI&lt;/i&gt;) il Gini è calcolato da indagini sulle famiglie e può riguardare il reddito o la spesa per consumi; per questo i confronti fra paesi vanno fatti con cautela, e i Gini nazionali non si possono sommare per ottenere un Gini regionale o mondiale. &lt;a href=&quot;https://databank.worldbank.org/metadataglossary/jobs/series/SI.POV.GINI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank · Metadata glossary&lt;/a&gt;&lt;/div&gt;

  &lt;h3&gt;In cima alla scala: i più ricchi del mondo&lt;/h3&gt;
  &lt;p&gt;Le slide 29‑30 mostrano le due top‑10 Forbes del 2025, separate per uomini e donne: un modo per far vedere la stratificazione estrema della &lt;b&gt;wealth&lt;/b&gt; e, insieme, il &lt;b&gt;gender gap&lt;/b&gt; anche al vertice.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 720 310&quot; id=&quot;billbars&quot; role=&quot;img&quot; aria-label=&quot;Patrimonio top 10 uomini e donne&quot;&gt;&lt;/svg&gt;
    &lt;figcaption&gt;&lt;span style=&quot;color:var(--ardesia)&quot;&gt;■&lt;/span&gt; top‑10 uomini · &lt;span style=&quot;color:var(--mattone)&quot;&gt;■&lt;/span&gt; top‑10 donne, per posizione (miliardi di $). &lt;span id=&quot;billsum&quot;&gt;&lt;/span&gt;&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;div class=&quot;warn&quot;&gt;&lt;b&gt;Da verificare sul materiale.&lt;/b&gt; Le slide indicano i patrimoni “&lt;i&gt;as of April 7, 2025&lt;/i&gt;”, ma secondo Forbes la data di riferimento della lista 2025 è il 7 &lt;b&gt;marzo&lt;/b&gt; 2025 (&lt;a href=&quot;https://www.forbes.com.au/news/billionaires/forbes-worlds-billionaires-list-2025-the-top-200/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Forbes Australia&lt;/a&gt;, fonte esterna). Nella tabella delle donne, inoltre, Françoise Bettencourt Meyers (L’Oréal) risulta di nazionalità &lt;b&gt;francese&lt;/b&gt; e Marilyn Simons &lt;b&gt;statunitense&lt;/b&gt;, non “United States” e “Spain” come scritto: probabili refusi. Controlla su &lt;a href=&quot;https://www.forbes.com/billionaires/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;forbes.com/billionaires&lt;/a&gt;.&lt;/div&gt;

  &lt;h3&gt;The &lt;span class=&quot;en&quot;&gt;one percent&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;La stratificazione within‑country di reddito e ricchezza nelle società contemporanee è molto &lt;b&gt;skewed&lt;/b&gt; (asimmetrica, sbilanciata): gran parte è nelle mani del &lt;b&gt;top 1%&lt;/b&gt;. Gli studiosi chiamano questo fenomeno “&lt;i&gt;the one percent&lt;/i&gt;”.&lt;/p&gt;
  &lt;figure&gt;
    &lt;svg viewBox=&quot;0 0 600 120&quot; role=&quot;img&quot; aria-label=&quot;100 persone, una con metà della ricchezza&quot;&gt;
      &lt;g id=&quot;onepct&quot;&gt;&lt;/g&gt;
    &lt;/svg&gt;
    &lt;figcaption&gt;100 quadratini = 100 persone. Nel documentario suggerito, l’1% degli americani controlla “quasi metà” della ricchezza del paese: il quadratino pieno possiede quanto tutti gli altri 99 insieme (circa).&lt;/figcaption&gt;
  &lt;/figure&gt;
  &lt;script&gt;(function(){var g=document.getElementById(&quot;onepct&quot;),h=&quot;&quot;;for(var i=0;i&lt;100;i++){var x=10+(i%25)*23,y=10+Math.floor(i/25)*26;h+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;18&quot; height=&quot;20&quot; rx=&quot;3&quot; class=&quot;&#x27;+(i===0?&quot;ft&quot;:&quot;ftb st&quot;)+&#x27;&quot;/&gt;&#x27;}g.innerHTML=h})();&lt;/script&gt;
  &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Documentario suggerito: &lt;i&gt;The One Percent&lt;/i&gt; (2006)&lt;/h4&gt;&lt;p&gt;Circa 80 minuti; il regista &lt;b&gt;Jamie Johnson&lt;/b&gt;, 27enne erede della fortuna Johnson &amp;amp; Johnson (già autore di &lt;i&gt;Born Rich&lt;/i&gt;, HBO 2003), esplora le ragioni politiche, morali ed emotive che permettono a una piccola percentuale di americani di controllare quasi metà della ricchezza degli Stati Uniti. Interviste con Nicole Buffett, Bill Gates Sr., Adnan Khashoggi, Milton Friedman, Robert Reich, Ralph Nader. Link nelle slide: &lt;a href=&quot;https://www.youtube.com/watch?v=IK35cxb3rkA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;

  &lt;h3&gt;Perché conta: &lt;span class=&quot;en&quot;&gt;health and social problems are worse in more unequal countries&lt;/span&gt;&lt;/h3&gt;
  &lt;p&gt;Ultima slide e chiusura del ragionamento: fra i paesi ricchi, quelli con &lt;b&gt;più disuguaglianza di reddito&lt;/b&gt; hanno un &lt;b&gt;indice di problemi sanitari e sociali&lt;/b&gt; peggiore (Wilkinson &amp;amp; Pickett, 2009). Non conta solo quanto è ricco un paese, ma &lt;b&gt;come&lt;/b&gt; la ricchezza è distribuita.&lt;/p&gt;
  &lt;div class=&quot;grid2&quot;&gt;
    &lt;figure style=&quot;margin:0&quot;&gt;
      &lt;svg viewBox=&quot;0 0 600 380&quot; role=&quot;img&quot; aria-label=&quot;Indice di problemi sanitari e sociali contro disuguaglianza di reddito&quot; id=&quot;spirit&quot;&gt;
        &lt;line x1=&quot;40&quot; y1=&quot;20&quot; x2=&quot;40&quot; y2=&quot;345&quot; class=&quot;sm&quot;/&gt;&lt;line x1=&quot;40&quot; y1=&quot;345&quot; x2=&quot;570&quot; y2=&quot;345&quot; class=&quot;sm&quot;/&gt;
        &lt;line x1=&quot;70&quot; y1=&quot;307&quot; x2=&quot;522&quot; y2=&quot;60&quot; class=&quot;si&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;g font-size=&quot;11&quot; class=&quot;fm&quot;&gt;&lt;text x=&quot;36&quot; y=&quot;28&quot; text-anchor=&quot;end&quot;&gt;Worse&lt;/text&gt;&lt;text x=&quot;36&quot; y=&quot;342&quot; text-anchor=&quot;end&quot;&gt;Better&lt;/text&gt;&lt;text x=&quot;42&quot; y=&quot;362&quot;&gt;Low&lt;/text&gt;&lt;text x=&quot;568&quot; y=&quot;362&quot; text-anchor=&quot;end&quot;&gt;High&lt;/text&gt;&lt;/g&gt;
        &lt;text x=&quot;300&quot; y=&quot;375&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; class=&quot;fi&quot;&gt;Income inequality →&lt;/text&gt;
        &lt;g class=&quot;fa&quot; id=&quot;sppts&quot;&gt;&lt;/g&gt;
      &lt;/svg&gt;
    &lt;/figure&gt;
    &lt;div&gt;
      &lt;p class=&quot;small muted&quot;&gt;Tocca un punto per leggere il paese. Posizioni ricostruite a occhio dal grafico della slide 32.&lt;/p&gt;
      &lt;p class=&quot;card&quot; id=&quot;spout&quot;&gt;—&lt;/p&gt;
      &lt;details class=&quot;acc&quot; open&gt;&lt;summary&gt;Che cosa contiene l’indice&lt;/summary&gt;&lt;div&gt;&lt;p&gt;Life expectancy · maths &amp;amp; literacy · infant mortality · homicides · imprisonment · teenage births · trust · obesity · mental illness (incl. drug and alcohol addiction) · social mobility.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Nota l’ultima voce: dove la scala è più ripida è anche più difficile salirla. Stratificazione e mobilità sono legate.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;(function(){var P=[[&quot;USA&quot;,440,39],[&quot;Portugal&quot;,400,114],[&quot;UK&quot;,340,149],[&quot;Greece&quot;,270,186],[&quot;Ireland&quot;,260,197],[&quot;New Zealand&quot;,314,194],[&quot;France&quot;,227,215],[&quot;Australia&quot;,328,213],[&quot;Austria&quot;,171,218],[&quot;Germany&quot;,198,225],[&quot;Canada&quot;,230,226],[&quot;Italy&quot;,303,230],[&quot;Denmark&quot;,134,237],[&quot;Belgium&quot;,155,240],[&quot;Spain&quot;,223,246],[&quot;Switzerland&quot;,238,261],[&quot;Finland&quot;,92,258],[&quot;Netherlands&quot;,206,266],[&quot;Norway&quot;,102,277],[&quot;Sweden&quot;,108,294],[&quot;Japan&quot;,71,333]],g=document.getElementById(&quot;sppts&quot;),o=document.getElementById(&quot;spout&quot;),ns=&quot;http://www.w3.org/2000/svg&quot;;P.forEach(function(p){var c=document.createElementNS(ns,&quot;circle&quot;);c.setAttribute(&quot;cx&quot;,p[1]);c.setAttribute(&quot;cy&quot;,p[2]);c.setAttribute(&quot;r&quot;,p[0]===&quot;Italy&quot;?8:6.5);c.setAttribute(&quot;class&quot;,p[0]===&quot;Italy&quot;?&quot;ft&quot;:&quot;fa&quot;);c.style.cursor=&quot;pointer&quot;;c.setAttribute(&quot;tabindex&quot;,&quot;0&quot;);var t=document.createElementNS(ns,&quot;title&quot;);t.textContent=p[0];c.appendChild(t);function s(){var hi=p[2]&lt;(307-(p[1]-70)*247/452);o.innerHTML=&quot;&lt;b&gt;&quot;+p[0]+&quot;&lt;/b&gt;: disuguaglianza &quot;+(p[1]&lt;180?&quot;bassa&quot;:p[1]&lt;300?&quot;media&quot;:&quot;alta&quot;)+&quot;; problemi &quot;+(hi?&quot;&lt;b&gt;sopra&lt;/b&gt;&quot;:&quot;&lt;b&gt;sotto&lt;/b&gt;&quot;)+&quot; quanto previsto dalla retta.&quot;}c.addEventListener(&quot;click&quot;,s);c.addEventListener(&quot;focus&quot;,s);g.appendChild(c)});var lb=document.createElementNS(ns,&quot;g&quot;);lb.setAttribute(&quot;font-size&quot;,&quot;11&quot;);lb.setAttribute(&quot;class&quot;,&quot;fi&quot;);[[&quot;USA&quot;,450,43],[&quot;Japan&quot;,81,337],[&quot;Sweden&quot;,118,298],[&quot;Portugal&quot;,410,118],[&quot;UK&quot;,350,153],[&quot;Italy&quot;,314,234]].forEach(function(l){var t=document.createElementNS(ns,&quot;text&quot;);t.setAttribute(&quot;x&quot;,l[1]);t.setAttribute(&quot;y&quot;,l[2]);t.textContent=l[0];lb.appendChild(t)});g.parentNode.appendChild(lb)})();&lt;/script&gt;
  &lt;div class=&quot;ext&quot;&gt;Richard Wilkinson e Kate Pickett, &lt;i&gt;The Spirit Level: Why Equality is Better for Everyone&lt;/i&gt; (2009). L’indice combina gli indicatori per 21 paesi ricchi; gli autori hanno replicato il risultato con i dati UNICEF sul benessere dei bambini e con gli stati USA. Il libro è stato criticato (il nesso causale è discusso) e l’edizione 2010 aggiunge un capitolo di risposta; nel 2024 l’Equality Trust ha pubblicato l’aggiornamento “The Spirit Level at 15”. &lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Equality Trust&lt;/a&gt;&lt;/div&gt;

  &lt;div class=&quot;quiz&quot;&gt;
    &lt;h3&gt;Autoverifica · Parte 5&lt;/h3&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;1. Cosa significano un Gini di 0 e uno di 100?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;0: tutti hanno lo stesso reddito/ricchezza. 100: tutto è nelle mani di una sola persona.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;2. Quale paese della tabella ha il Gini più alto e quale il più basso? E l’Italia?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Più alto: Sudafrica (63,0). Più basso: Danimarca (28,2). Italia: 35,4, più diseguale di Francia, Germania e UK ma meno degli USA (41,5).&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;3. “Il 10% della popolazione detiene il 40% del reddito”: perché indica stratificazione?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Perché in una distribuzione uguale quel 10% avrebbe il 10% del reddito: detenerne il 40% significa avere quattro volte la propria “quota”, quindi la curva di Lorenz si allontana dalla diagonale.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;4. Differenza fra income e wealth?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Il reddito è un flusso (entrate in un periodo), la ricchezza è uno stock (patrimonio posseduto). La ricchezza è in genere più concentrata.&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;q&quot;&gt;&lt;p&gt;5. Che cosa mostra il grafico di Wilkinson &amp;amp; Pickett e perché completa la Preston curve?&lt;/p&gt;&lt;button class=&quot;btn&quot;&gt;Mostra risposta&lt;/button&gt;&lt;div class=&quot;ans&quot; hidden&gt;Che fra i paesi ricchi i problemi sanitari e sociali (vita attesa, omicidi, obesità, fiducia, mobilità…) sono peggiori dove la disuguaglianza di reddito è maggiore. La Preston curve mostra che oltre una certa soglia il reddito medio aggiunge poco: a quel punto pesa di più la distribuzione.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;
&lt;section id=&quot;fonti&quot; class=&quot;part p-acc&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
  &lt;div class=&quot;partno&quot;&gt;Per approfondire&lt;/div&gt;
  &lt;h2&gt;Autori, studi, dati e siti citati nelle slide&lt;/h2&gt;
  &lt;p&gt;Ogni scheda indica in che slide compare il riferimento. Descrizioni e link vengono da ricerche web: sono &lt;b&gt;fonti esterne&lt;/b&gt;, non contenuto della lezione.&lt;/p&gt;
  &lt;div class=&quot;refs&quot;&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Marx &amp;amp; Engels — &lt;i&gt;Manifesto of the Communist Party&lt;/i&gt; (1848)&lt;/h4&gt;&lt;p&gt;Il testo in cui la storia è letta come “storia di lotte di classi” e l’epoca moderna come divisione in due campi ostili, borghesia e proletariato. È la base del modello a due classi della slide 16.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 16 · &lt;a href=&quot;https://www.marxists.org/archive/marx/works/1848/communist-manifesto/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Marxists Internet Archive (testo integrale)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Erikson &amp;amp; Goldthorpe — &lt;i&gt;The Constant Flux&lt;/i&gt; (1992)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;A Study of Class Mobility in Industrial Societies&lt;/i&gt;, Clarendon Press (Oxford). Grande studio comparato sulla mobilità di classe nei paesi industriali, costruito sullo schema di classi occupazionali della slide 17; un classico degli studi su stratificazione e mobilità.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 17 · &lt;a href=&quot;https://catalog.hathitrust.org/Record/002533920&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HathiTrust (scheda bibliografica)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Samuel H. Preston (1975) — la Preston curve&lt;/h4&gt;&lt;p&gt;“The changing relation between mortality and level of economic development”, &lt;i&gt;Population Studies&lt;/i&gt;. Mostra la relazione concava reddito‑vita attesa e il suo spostamento verso l’alto nel tempo, che attribuisce soprattutto ai progressi medici. Ristampato con commento nel &lt;i&gt;Bulletin of the WHO&lt;/i&gt; 81(11), 2003.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 14 · &lt;a href=&quot;https://scielosp.org/article/bwho/2003.v81n11/831-832&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Bulletin of the WHO — Public health classic&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Helliwell, Layard &amp;amp; Sachs — &lt;i&gt;World Happiness Report 2018&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;Classifica 156 paesi per felicità (valutazione della propria vita, sondaggi Gallup 2015‑2017) e 117 per la felicità degli immigrati, tema centrale di quell’edizione. È la fonte della colonna &lt;i&gt;Happiness score&lt;/i&gt; della slide 13.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 13 · &lt;a href=&quot;https://worldhappiness.report/blog/finland-wins-double-gold-in-world-happiness-report-2018/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Happiness Report&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;World Bank — World Development Indicators e Gini index&lt;/h4&gt;&lt;p&gt;Le slide citano World Bank 2017a (PIL, vita attesa) e 2017b (Gini). L’indicatore &lt;i&gt;SI.POV.GINI&lt;/i&gt; è calcolato da indagini sulle famiglie (reddito o consumo) come area fra curva di Lorenz e retta di uguaglianza; oggi è pubblicato nella Poverty and Inequality Platform.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 13, 14, 23, 28 · &lt;a href=&quot;https://databank.worldbank.org/metadataglossary/jobs/series/SI.POV.GINI&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;World Bank DataBank — Gini metadata&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;World Population Review&lt;/h4&gt;&lt;p&gt;Sito divulgativo di dati demografici che raccoglie cifre da fonti come ONU, Banca Mondiale e censimenti, e produce proprie proiezioni. Utile per consultare dati in fretta; per citarli conviene risalire alla fonte primaria indicata pagina per pagina.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 13–14 · &lt;a href=&quot;https://worldpopulationreview.com/about&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldpopulationreview.com — About&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Nakao &amp;amp; Treas (1994) — occupational prestige&lt;/h4&gt;&lt;p&gt;“Updating Occupational Prestige and Socioeconomic Scores: How the New Measures Measure Up”, &lt;i&gt;Sociological Methodology&lt;/i&gt; 24: 1‑72. Punteggi di prestigio 0‑100 dal General Social Survey 1989, ancora usati nei dati IPUMS e nei lavori su indici socio‑economici.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 20 · &lt;a href=&quot;https://usa.ipums.org/usa-action/variables/PRENT&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;IPUMS USA — PRENT&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Henley Passport Index&lt;/h4&gt;&lt;p&gt;Classifica mensile di 199 passaporti su 227 destinazioni, basata su dati IATA e ricerca interna; 1 punto per ogni destinazione senza visto preventivo. Prodotta da una società privata di consulenza sulla cittadinanza: è un indice, non una statistica ufficiale.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 23–25 · &lt;a href=&quot;https://www.henleyglobal.com/passport-index/ranking&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Ranking&lt;/a&gt; · &lt;a href=&quot;https://www.henleyglobal.com/passport-index/methodology&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Methodology&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;CNN (14 ott. 2025) — US fuori dalla top 10&lt;/h4&gt;&lt;p&gt;Articolo di Maureen O’Hare: gli USA scendono al 12° posto (pari alla Malaysia, 180 destinazioni), la prima volta nei 20 anni dell’indice; pesa la mancanza di reciprocità (solo 46 nazionalità entrano negli USA senza visto).&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 24 · &lt;a href=&quot;https://edition.cnn.com/2025/10/14/travel/travel-news-most-powerful-passports&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CNN&lt;/a&gt; · &lt;a href=&quot;https://skift.com/2025/10/14/us-passport-power-historic-low/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Skift&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Forbes — World’s Billionaires 2025&lt;/h4&gt;&lt;p&gt;Lista annuale di chi ha un patrimonio stimato ≥ 1 miliardo $: nel 2025 3.028 persone con 16.100 miliardi complessivi, valori al 7 marzo 2025. Esiste anche una classifica in tempo reale, per cui le cifre cambiano di giorno in giorno.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 29–30 · &lt;a href=&quot;https://www.forbes.com/billionaires/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;forbes.com/billionaires&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;&lt;i&gt;The One Percent&lt;/i&gt; (2006), Jamie Johnson&lt;/h4&gt;&lt;p&gt;Documentario presentato al Tribeca Film Festival e trasmesso da HBO (serie &lt;i&gt;America Undercover&lt;/i&gt;). Il regista intervista economisti, politici e la propria famiglia sul divario di ricchezza negli USA.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 31 · &lt;a href=&quot;https://en.wikipedia.org/wiki/The_One_Percent_(film)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia&lt;/a&gt; · &lt;a href=&quot;https://www.youtube.com/watch?v=IK35cxb3rkA&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube (link delle slide)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Wilkinson &amp;amp; Pickett — &lt;i&gt;The Spirit Level&lt;/i&gt; (2009)&lt;/h4&gt;&lt;p&gt;&lt;i&gt;Why Equality is Better for Everyone&lt;/i&gt;. Correlazione fra disuguaglianza di reddito e un indice di 10‑11 problemi sanitari e sociali in 21 paesi ricchi. Molto influente e molto discusso; aggiornato nel 2024 (“The Spirit Level at 15”).&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Slide 32 · &lt;a href=&quot;https://equalitytrust.org.uk/resources/the-spirit-level&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Equality Trust&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;Kimberlé Crenshaw (1989) — intersectionality&lt;/h4&gt;&lt;p&gt;“Demarginalizing the Intersection of Race and Sex”, &lt;i&gt;University of Chicago Legal Forum&lt;/i&gt;: l’articolo che introduce il concetto, criticando l’analisi “a un solo asse” del diritto antidiscriminatorio. Non è citato nelle slide (che mostrano solo un diagramma con credito &lt;i&gt;First Book&lt;/i&gt;), ma è il riferimento d’origine.&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Collegato a slide 9 · &lt;a href=&quot;https://scholarship.law.columbia.edu/faculty_scholarship/3007&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Columbia Law Scholarship Archive&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;ref&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Fonte esterna&lt;/span&gt;&lt;h4&gt;UN — SDG 10 &lt;i&gt;Reduced inequalities&lt;/i&gt;&lt;/h4&gt;&lt;p&gt;“Reduce inequality within and among countries”: 10 target al 2030, fra cui la crescita del reddito del 40% più povero sopra la media nazionale (10.1), l’inclusione di tutti indipendentemente da età, sesso, disabilità, etnia, religione o status (10.2) e una maggiore voce dei paesi in via di sviluppo nelle istituzioni internazionali (10.6). Collega questa lezione alla precedente (slide 2).&lt;/p&gt;&lt;p class=&quot;where&quot;&gt;Collegato a slide 2, 21 · &lt;a href=&quot;https://ourworldindata.org/sdgs/reduced-inequalities&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Our World in Data — SDG 10 tracker&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;p class=&quot;small muted&quot; style=&quot;margin-top:1.2rem&quot;&gt;La tabella sulla vita attesa per classe in Inghilterra e Galles (slide 18) non riporta una fonte nella slide. Le serie storiche di questo tipo sono pubblicate dall’ONS (“Trends in life expectancy by social class”); non ho trovato online la tabella 1997‑99 precisa.&lt;/p&gt;
&lt;/div&gt;&lt;/section&gt;
