&lt;g fill=&quot;var(--slate)&quot;&gt;&lt;circle cx=&quot;740&quot; cy=&quot;125&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;780&quot; cy=&quot;125&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;820&quot; cy=&quot;125&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;760&quot; cy=&quot;160&quot; r=&quot;7&quot;/&gt;&lt;circle cx=&quot;800&quot; cy=&quot;160&quot; r=&quot;7&quot;/&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;text x=&quot;680&quot; y=&quot;232&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;“John” and “Kaito” as behaviour &lt;tspan font-style=&quot;italic&quot;&gt;typical&lt;/tspan&gt; of a context&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;From the sociological perspective, John (USA) and Kaito (Japan) are not isolated cases: they represent what is typical of their respective contexts.&lt;/figcaption&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sociological imagination&lt;/b&gt; (C. Wright Mills): the capacity to connect an individual’s biography with the history and structure of the society in which they live. John’s weight can only really be understood by also looking at how people eat, work and earn in the United States.&lt;/div&gt;

&lt;h3&gt;The data: the same phenomenon, very different contexts&lt;/h3&gt;
&lt;p&gt;Slides 11 and 14 present two tables for 19 countries: adult overweight and obesity (WHO, 2016b, 2014 data) and under-five mortality (UNICEF, 2016, 2015 data). Choose an indicator and move the threshold.&lt;/p&gt;
&lt;div class=&quot;figure&quot; id=&quot;chart&quot;&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Indicator&quot;&gt;
&lt;button class=&quot;btn&quot; data-m=&quot;ow&quot; aria-pressed=&quot;true&quot;&gt;Overweight %&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-m=&quot;ob&quot; aria-pressed=&quot;false&quot;&gt;Obesity %&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-m=&quot;u5&quot; aria-pressed=&quot;false&quot;&gt;Under-5 mortality ‰&lt;/button&gt;
&lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;
&lt;button class=&quot;btn&quot; id=&quot;sortbtn&quot; aria-pressed=&quot;false&quot;&gt;Sort by value&lt;/button&gt;
&lt;/div&gt;
&lt;label class=&quot;sl&quot;&gt;Threshold: highlight countries above &lt;output id=&quot;thv&quot;&gt;50&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;th&quot; min=&quot;0&quot; max=&quot;70&quot; step=&quot;1&quot; value=&quot;50&quot;&gt;&lt;/label&gt;
&lt;svg id=&quot;bars&quot; viewBox=&quot;0 0 900 470&quot; role=&quot;img&quot; aria-label=&quot;Bar chart by country&quot;&gt;&lt;/svg&gt;
&lt;p class=&quot;cap&quot; id=&quot;chartnote&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;badge b-note&quot;&gt;note&lt;/span&gt; What do “overweight” and “obesity” mean?&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;They are defined using the &lt;em class=&quot;t&quot;&gt;Body Mass Index&lt;/em&gt; (BMI):&lt;/p&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.25rem;text-align:center&quot;&gt;BMI = weight (kg) ÷ height² (m²)&lt;/p&gt;
&lt;p&gt;According to the WHO, for adults (18+), &lt;b&gt;overweight&lt;/b&gt; = BMI ≥ 25 and &lt;b&gt;obesity&lt;/b&gt; = BMI ≥ 30; the obese are therefore a subset of the overweight. This is why the second column of the table is always smaller than the first. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; &lt;a href=&quot;https://www.who.int/data/gho/data/themes/topics/indicator-groups/indicator-group-details/GHO/overweight-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WHO Global Health Observatory&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Under-five mortality rate&lt;/em&gt;: the probability of dying before the age of 5, expressed per 1,000 live births.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What do the data teach us, as sociologists?&lt;/summary&gt;&lt;div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;The differences between countries are huge (obesity at 34.9% in the USA, 3.9% in Japan, 3.5% in India): individual genetics cannot explain such wide gaps between populations.&lt;/li&gt;
&lt;li&gt;Countries with higher obesity generally have low child mortality, and vice versa (Nigeria: 8.1% obese, 107.5‰ under-five deaths). Both indicators track the level and type of development: diet, income, healthcare.&lt;/li&gt;
&lt;li&gt;Japan is the exception: wealthy, yet with little obesity. Food culture, social norms and urban organisation matter. This is the “Kaito” of the slide.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · sociological perspective&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Use an example to explain the difference between the individual and the sociological perspective.&lt;/summary&gt;&lt;div&gt;Individual: John is obese because he eats badly, has little self-control or a genetic predisposition. Sociological: in the USA obesity affects more than one adult in three, because food, work, transport and income there encourage certain behaviours. John is a &lt;em&gt;typical&lt;/em&gt; case of his context.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Are sociologists uninterested in individuals?&lt;/summary&gt;&lt;div&gt;No. The slide states it explicitly: the emphasis is on relations between individuals, on their social position and on the interdependence between society and individuals.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does “systematic” mean in the definition of sociology?&lt;/summary&gt;&lt;div&gt;That the study proceeds methodically (data collection, comparison, generalisation), looking for &lt;em&gt;patterns&lt;/em&gt; rather than anecdotes.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The object&lt;/div&gt;&lt;h2&gt;Social problems: from personal trouble to public issue&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slides 12–15: “Social problems”, “Personal trouble and public issue”, UNICEF table, “Examples of social problems”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;The distinction comes from &lt;b&gt;C. Wright Mills&lt;/b&gt;, &lt;i&gt;The Sociological Imagination&lt;/i&gt; (1959).&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Trouble or issue&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-trouble&quot;&gt;Personal trouble&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-issue&quot;&gt;Public issue&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot; role=&quot;tabpanel&quot; id=&quot;t-trouble&quot;&gt;&lt;h4&gt;Personal trouble · individual problem&lt;/h4&gt;&lt;p&gt;It concerns the person and their immediate milieu. &lt;b&gt;Example from the slide:&lt;/b&gt; John is obese.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The solution is sought in the private sphere: diet, doctor, willpower.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; role=&quot;tabpanel&quot; id=&quot;t-issue&quot; hidden&gt;&lt;h4&gt;Public issue · social problem&lt;/h4&gt;&lt;p&gt;It concerns many people &lt;b&gt;and&lt;/b&gt; is perceived as undesirable. &lt;b&gt;Example from the slide:&lt;/b&gt; many people are obese, and this is considered harmful.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;The solution requires collective action: food policy, urban planning, public health.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The two conditions of a social problem&lt;/h3&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 270&quot; role=&quot;img&quot; aria-label=&quot;Venn diagram: a social problem arises from the intersection of prevalence and conflict with values&quot;&gt;
&lt;circle cx=&quot;370&quot; cy=&quot;135&quot; r=&quot;115&quot; fill=&quot;var(--ochre)&quot; fill-opacity=&quot;.18&quot; stroke=&quot;var(--ochre)&quot;/&gt;
&lt;circle cx=&quot;530&quot; cy=&quot;135&quot; r=&quot;115&quot; fill=&quot;var(--accent)&quot; fill-opacity=&quot;.14&quot; stroke=&quot;var(--accent)&quot;/&gt;
&lt;text x=&quot;310&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;Goes beyond&lt;/text&gt;
&lt;text x=&quot;310&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;the individual&lt;/text&gt;
&lt;text x=&quot;310&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;affects many people&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;Many people&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;are concerned&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;conflicts with certain values&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;SOCIAL&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;PROBLEM&lt;/text&gt;
&lt;text x=&quot;90&quot; y=&quot;250&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;widespread but not seen as harmful → social phenomenon&lt;/text&gt;
&lt;text x=&quot;560&quot; y=&quot;250&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;causes outrage but affects few → individual case&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;&lt;span class=&quot;badge b-note&quot;&gt;note&lt;/span&gt; The second condition makes the social problem partly a &lt;b&gt;social construction&lt;/b&gt;: it depends on a society’s values at a given moment. What is a problem today (e.g. bullying) may not have been one in the past.&lt;/figcaption&gt;
&lt;/div&gt;

&lt;h3&gt;Child mortality: a global public issue&lt;/h3&gt;
&lt;p&gt;The UNICEF table (slide 14) should be read as follows: a child born in Nigeria is about &lt;b&gt;36 times&lt;/b&gt; more likely to die before the age of 5 than one born in Japan (107.5 versus 3.0 per thousand). No individual explanation can account for a gap of this size. All the values are shown in the chart in section 2, under the “Under-5 mortality” indicator.&lt;/p&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 140&quot; role=&quot;img&quot; aria-label=&quot;Pictogram: under-five deaths per 1,000 births in Japan, Italy, China, India, Pakistan and Nigeria&quot;&gt;
&lt;g id=&quot;picto&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Each small square = 1 death per 1,000 live births (rounded values, UNICEF 2016 data from slide 14).&lt;/figcaption&gt;
&lt;/div&gt;

&lt;h3&gt;Examples of social problems&lt;/h3&gt;
&lt;p&gt;Slide 15 lists 14 of them. Filter by scale to see how they are distributed: some arise in everyday life, others are global.&lt;/p&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Scale filter&quot; id=&quot;spf&quot;&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;All&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;micro&quot; aria-pressed=&quot;false&quot;&gt;Everyday life&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;meso&quot; aria-pressed=&quot;false&quot;&gt;National society&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;macro&quot; aria-pressed=&quot;false&quot;&gt;Global&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;chips&quot; id=&quot;spchips&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;note&lt;/span&gt; The classification by scale is a reading aid and does not appear in the slides. Many problems span several levels: migration, for example, is global in its causes and everyday in its effects.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · social problems&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Which two conditions must be met for a phenomenon to be a social problem?&lt;/summary&gt;&lt;div&gt;(1) It goes beyond the individual, i.e. it affects many people; (2) many people are concerned about it because it conflicts with certain values.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Is Maria’s unemployment a personal trouble or a public issue?&lt;/summary&gt;&lt;div&gt;Taken on its own, it is a &lt;em&gt;personal trouble&lt;/em&gt;. If the unemployment rate is high (slide 15: “high unemployment rate”), it becomes a &lt;em&gt;public issue&lt;/em&gt;: the causes are structural (the economy, the labour market) and the solution cannot be purely individual. This is Mills’s classic example.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is “global warming and pollution” among the social problems in a sociology lecture?&lt;/summary&gt;&lt;div&gt;Because it has social causes (consumption, production, policy), affects groups unequally and conflicts with shared values (health, justice towards future generations). It also requires the perspective of the natural sciences, however: see section 4.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Complexity&lt;/div&gt;&lt;h2&gt;Interdisciplinarity: the DominoES case&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 16: “Interdisciplinarity”, DominoES diagram (Interacting Tipping Elements).&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;The complexity of contemporary problems calls for &lt;em class=&quot;t&quot;&gt;interdisciplinarity&lt;/em&gt; (bringing different disciplines, such as climate science and sociology, to work together on the same question). The example is the climate crisis, as analysed by the &lt;b&gt;DominoES&lt;/b&gt; project, “Domino Effects in the Earth System: Can Antarctica tip climate policy?”.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Tipping element&lt;/b&gt;: a component of the Earth system that, once a threshold (&lt;em&gt;tipping point&lt;/em&gt;) is crossed, changes state abruptly and often irreversibly. Examples: the Greenland and Antarctic ice sheets, ocean circulation. The elements &lt;b&gt;interact&lt;/b&gt;: one that “falls” can push the others, like dominoes.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Follow the chain step by step: the diagram links the physical system (left) with the social system (right).&lt;/p&gt;
&lt;div class=&quot;figure steps&quot; data-cb=&quot;dominoStep&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 360&quot; role=&quot;img&quot; aria-label=&quot;Diagram of the DominoES chain from the climate system to the social system&quot; id=&quot;domino&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;470&quot; height=&quot;340&quot; rx=&quot;16&quot; fill=&quot;var(--sage-bg)&quot; opacity=&quot;.7&quot;/&gt;
&lt;rect x=&quot;500&quot; y=&quot;10&quot; width=&quot;390&quot; height=&quot;340&quot; rx=&quot;16&quot; fill=&quot;var(--slate-bg)&quot; opacity=&quot;.7&quot;/&gt;
&lt;text x=&quot;245&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; letter-spacing=&quot;2&quot; fill=&quot;var(--sage)&quot;&gt;EARTH SYSTEM&lt;/text&gt;
&lt;text x=&quot;695&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; letter-spacing=&quot;2&quot; fill=&quot;var(--slate)&quot;&gt;SOCIAL SYSTEM&lt;/text&gt;
&lt;g fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ah)&quot;&gt;
&lt;path d=&quot;M150 88 L150 145&quot; data-s=&quot;1&quot;/&gt;
&lt;path d=&quot;M150 195 L150 255&quot; data-s=&quot;1&quot;/&gt;
&lt;path d=&quot;M240 285 C 340 285 330 90 245 75&quot; data-s=&quot;1&quot;/&gt;
&lt;path d=&quot;M300 70 L555 70&quot; data-s=&quot;2&quot;/&gt;
&lt;path d=&quot;M690 92 L690 135&quot; data-s=&quot;3&quot;/&gt;
&lt;path d=&quot;M690 185 L690 225&quot; data-s=&quot;3&quot;/&gt;
&lt;path d=&quot;M690 275 L690 300 L270 300&quot; data-s=&quot;4&quot;/&gt;
&lt;/g&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-n=&quot;0&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;48&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;75&quot; fill=&quot;var(--ink)&quot;&gt;Greenland Ice Sheet&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;1&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;148&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;168&quot; fill=&quot;var(--ink)&quot;&gt;Thermohaline&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;184&quot; fill=&quot;var(--ink)&quot;&gt;ocean circulation&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;1&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;258&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;285&quot; fill=&quot;var(--ink)&quot;&gt;Antarctic Ice Sheet&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;2&quot;&gt;&lt;rect x=&quot;560&quot; y=&quot;48&quot; width=&quot;260&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;75&quot; fill=&quot;var(--ink)&quot;&gt;(anticipated) climate impacts&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;3&quot;&gt;&lt;rect x=&quot;590&quot; y=&quot;140&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;167&quot; fill=&quot;var(--ink)&quot;&gt;public opinion&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;3&quot;&gt;&lt;rect x=&quot;590&quot; y=&quot;228&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;255&quot; fill=&quot;var(--ink)&quot;&gt;climate policy&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;4&quot;&gt;&lt;rect x=&quot;280&quot; y=&quot;318&quot; width=&quot;240&quot; height=&quot;28&quot; rx=&quot;14&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;337&quot; fill=&quot;var(--ink)&quot;&gt;greenhouse gas emissions ↓↑&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;b&gt;1 · The starting point.&lt;/b&gt; The melting of the Greenland ice sheet releases fresh water into the ocean (&lt;em&gt;freshwater input&lt;/em&gt;).&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;2 · Physical dominoes.&lt;/b&gt; The fresh water slows the &lt;em class=&quot;t&quot;&gt;thermohaline circulation&lt;/em&gt; (ocean circulation driven by temperature and salinity). This alters heat accumulation in the Southern Ocean and can destabilise the Antarctic ice sheet. The elements are &lt;b&gt;interacting&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;3 · The bridge to society.&lt;/b&gt; Climate impacts, even merely &lt;b&gt;expected&lt;/b&gt; ones (&lt;em&gt;anticipated&lt;/em&gt;), enter people’s perceptions. Here the question becomes a sociological one.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;4 · Social tipping.&lt;/b&gt; Public opinion can in turn cross a threshold and drive &lt;em&gt;climate policy&lt;/em&gt;. The dashed arrow in the original diagram indicates that public opinion also directly affects emissions (through behaviour).&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;5 · The loop closes.&lt;/b&gt; Climate policy acts on greenhouse gas emissions, which in turn push (or slow) the physical tipping elements. Without the social sciences the model would be incomplete: this is why interdisciplinarity is needed.&lt;/div&gt;
&lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; DominoES was a joint project of the Potsdam Institute for Climate Impact Research (PIK) and GESIS – Leibniz Institute for the Social Sciences, funded by the Leibniz Association (from 2017). A related paper by the group argues that avoiding “unwanted” tipping may depend on a cascade of “wanted” social tipping (attitudes, behaviours, policies). &lt;a href=&quot;https://www.gesis.org/en/research/projects-and-exchange/external-funding-projects/details/project/42/domino-effects-in-the-earth-system&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS project page&lt;/a&gt; · &lt;a href=&quot;https://arxiv.org/abs/1911.10063v2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;paper on arXiv&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · interdisciplinarity&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Why does climate change require interdisciplinarity?&lt;/summary&gt;&lt;div&gt;Because the causal chain runs through both physical processes (ice sheets, oceans) and social processes (public opinion, policy, emissions). No single discipline can see the whole cycle.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does “anticipated” climate impacts mean?&lt;/summary&gt;&lt;div&gt;That even expected impacts, which have not yet occurred, can change opinions and policies. The social perception of risk matters, not only the damage already suffered.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 5 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The global agenda&lt;/div&gt;&lt;h2&gt;The SDGs and the 2030 Agenda&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slides 17–18: “SDGs Goals”, “SDGs” (quotation from sdgs.un.org/goals); slides 25–26 for the wording of the goals.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;In &lt;b&gt;2015&lt;/b&gt; the UN member states adopted the &lt;em class=&quot;t&quot;&gt;2030 Agenda for Sustainable Development&lt;/em&gt;. According to the UN:&lt;/p&gt;
&lt;blockquote&gt;[It] provides a shared blueprint for peace and prosperity for people and the planet, now and into the future.&lt;cite&gt;sdgs.un.org/goals, quoted on slide 18&lt;/cite&gt;&lt;/blockquote&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;At its heart are the &lt;b&gt;17 SDGs&lt;/b&gt;, “an urgent call for action” addressed to &lt;b&gt;all&lt;/b&gt; countries, developed and developing, in a &lt;em class=&quot;t&quot;&gt;global partnership&lt;/em&gt; (shared responsibility).&lt;/li&gt;
&lt;li&gt;Ending poverty must go &lt;i&gt;hand-in-hand&lt;/i&gt; with health, education, reducing inequality and economic growth, while tackling climate change and protecting oceans and forests.&lt;/li&gt;
&lt;li&gt;For Prof. Lomazzi, they are a &lt;b&gt;global strategy against inequalities&lt;/b&gt; combined with a &lt;b&gt;new idea of development&lt;/b&gt;. This statement bridges into sections 6 and 7.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The document is UN resolution &lt;b&gt;A/RES/70/1&lt;/b&gt;, “Transforming our world”, adopted at the New York summit of 25–27 September 2015: 17 goals and &lt;b&gt;169 targets&lt;/b&gt; to be achieved by 2030, with the commitment to “leave no one behind”. It builds on the &lt;em&gt;Millennium Development Goals&lt;/em&gt; (MDGs, 2000–2015) to complete what they had not achieved. &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Text of the resolution (UN)&lt;/a&gt;.&lt;/div&gt;

&lt;h3&gt;The 17 goals: explore&lt;/h3&gt;
&lt;p&gt;Click a goal to read its wording. Use the filters to see how the lecturer groups the goals related to inequality (slides 25–26, based on Freistein &amp;amp; Mahlert).&lt;/p&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Goal filter&quot; id=&quot;sdgf&quot; style=&quot;margin-bottom:.8rem&quot;&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;All&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;eq&quot; aria-pressed=&quot;false&quot;&gt;Reduce inequality / Ensure equity&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;inc&quot; aria-pressed=&quot;false&quot;&gt;Promote inclusion&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;none&quot; aria-pressed=&quot;false&quot;&gt;Not listed&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;sdg-grid&quot; id=&quot;sdg&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;card sdg-detail&quot; id=&quot;sdgd&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;small&quot;&gt;Select a goal.&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · SDGs&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;In what sense are the SDGs a “global partnership”?&lt;/summary&gt;&lt;div&gt;They apply to all countries, developed and developing, which share responsibility for the goals. They are no longer a programme designed by rich countries for poor countries.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does it mean that the goals go “hand-in-hand”?&lt;/summary&gt;&lt;div&gt;That they are interconnected: poverty cannot be eliminated without health, education and reduced inequality, and economic growth must coexist with protecting the climate, oceans and forests.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;When and by whom was the 2030 Agenda adopted?&lt;/summary&gt;&lt;div&gt;In 2015, by the member states of the United Nations (resolution A/RES/70/1).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 6 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s6&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The critique&lt;/div&gt;&lt;h2&gt;Questioning the concept of «development»&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slides 19–22: “Questioning the concept”, “Concepts of development”, “Western colonialism”, “Problems”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;The question on slide 19: &lt;b&gt;what does “development” mean?&lt;/b&gt; The word seems neutral and positive, but it has a history, and it is precisely this history that the SDGs attempt to correct.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Development studies.&lt;/b&gt; The field of study that emerged after the Second World War to explain and guide change in “undeveloped” countries. The term &lt;em class=&quot;t&quot;&gt;development&lt;/em&gt; referred to &lt;b&gt;evolutionary processes of social change&lt;/b&gt;, usually associated with an improvement in living standards.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;An example of the evolutionary view: Rostow (1960)&lt;/h3&gt;
&lt;p&gt;The slide cites Rostow as an example. His theory assumes that all societies climb the same ladder. Step through the stages.&lt;/p&gt;
&lt;div class=&quot;figure steps&quot; data-cb=&quot;rostowStep&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Ladder of Rostow’s five stages&quot; id=&quot;rostow&quot;&gt;
&lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-n=&quot;0&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;170&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;195&quot;&gt;Traditional society&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;1&quot;&gt;&lt;rect x=&quot;190&quot; y=&quot;135&quot; width=&quot;160&quot; height=&quot;75&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;160&quot;&gt;Preconditions&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;176&quot;&gt;for take-off&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;2&quot;&gt;&lt;rect x=&quot;360&quot; y=&quot;100&quot; width=&quot;160&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;125&quot;&gt;Take-off&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;3&quot;&gt;&lt;rect x=&quot;530&quot; y=&quot;65&quot; width=&quot;160&quot; height=&quot;145&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;90&quot;&gt;Drive to maturity&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;4&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;30&quot; width=&quot;180&quot; height=&quot;180&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;55&quot;&gt;High mass&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;71&quot;&gt;consumption&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;path d=&quot;M30 150 C 300 140 600 60 870 15&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;5 4&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;b&gt;1 · Traditional society.&lt;/b&gt; Agrarian economy, limited technology, low productivity.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;2 · Preconditions for take-off.&lt;/b&gt; The foundations are laid: institutions, infrastructure, entrepreneurs, applied science.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;3 · Take-off.&lt;/b&gt; Growth becomes self-sustaining, driven by a few leading industrial sectors.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;4 · Drive to maturity.&lt;/b&gt; Technology spreads throughout the economy, which diversifies.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;5 · Age of high mass consumption.&lt;/b&gt; Mass consumption and durable goods. The end point is the model of the United States and Western Europe: hence the idea of “following in the footsteps of the West”.&lt;/div&gt;
&lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Back&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Next →&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; The names of the stages come from W. W. Rostow, &lt;i&gt;The Stages of Economic Growth: A Non-Communist Manifesto&lt;/i&gt;, Cambridge University Press, 1960 (&lt;a href=&quot;https://www.cambridge.org/core/books/the-stages-of-economic-growth/9CB46055035A1915509CE15A57848A07&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge page&lt;/a&gt;). The slide only names the author.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;How goals and measures change&lt;/h3&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Goals and measures&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;d-goal&quot;&gt;What is pursued&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d-meas&quot;&gt;How it is measured&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;d-goal&quot;&gt;
&lt;div class=&quot;figure&quot;&gt;&lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Broadening of development goals&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;56&quot; fill=&quot;var(--ink)&quot;&gt;Economic growth&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;74&quot; fill=&quot;var(--ink)&quot;&gt;&amp;amp; industrialisation&lt;/text&gt;
&lt;rect x=&quot;240&quot; y=&quot;30&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;335&quot; y=&quot;65&quot; fill=&quot;var(--ink)&quot;&gt;Basic needs&lt;/text&gt;
&lt;rect x=&quot;460&quot; y=&quot;30&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;555&quot; y=&quot;65&quot; fill=&quot;var(--ink)&quot;&gt;Poverty reduction&lt;/text&gt;
&lt;rect x=&quot;680&quot; y=&quot;30&quot; width=&quot;210&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;785&quot; y=&quot;65&quot; fill=&quot;var(--ink)&quot;&gt;Sustainability&lt;/text&gt;
&lt;g stroke=&quot;var(--muted)&quot; marker-end=&quot;url(#ah)&quot;&gt;&lt;path d=&quot;M210 60 H236&quot;/&gt;&lt;path d=&quot;M430 60 H456&quot;/&gt;&lt;path d=&quot;M650 60 H676&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;110&quot; y=&quot;112&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;origins of the discipline&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;112&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;→ SDGs&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;Initially the goal is &lt;b&gt;economic growth and industrialisation&lt;/b&gt;. It then broadens to &lt;em class=&quot;t&quot;&gt;basic needs&lt;/em&gt; (food, water, housing, health, education), to &lt;b&gt;poverty reduction&lt;/b&gt; and finally to &lt;b&gt;sustainability&lt;/b&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;d-meas&quot; hidden&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;GNP · World Bank&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;em class=&quot;t&quot;&gt;Gross National Product&lt;/em&gt;: the value of goods and services produced by a country’s residents, including abroad. It is the measure used in the World Bank’s &lt;i&gt;World Development Reports&lt;/i&gt;. It captures only the economic dimension.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;HDI · UNDP&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;em class=&quot;t&quot;&gt;Human Development Index&lt;/em&gt;: adds formal education and life expectancy. Development becomes &lt;b&gt;human&lt;/b&gt; development, not just growth.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Try the HDI: how much does a weak dimension weigh?&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; Formula and thresholds (&lt;em&gt;goalposts&lt;/em&gt;) from &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP, HDR Technical Notes&lt;/a&gt;. The slides name the index without explaining how it is calculated.&lt;/p&gt;
&lt;div class=&quot;figure&quot; id=&quot;hdi&quot;&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.15rem;text-align:center;margin-top:0&quot;&gt;HDI = ( I&lt;sub&gt;health&lt;/sub&gt; × I&lt;sub&gt;education&lt;/sub&gt; × I&lt;sub&gt;income&lt;/sub&gt; )&lt;sup&gt;1/3&lt;/sup&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;sl&quot;&gt;Life expectancy (years) &lt;output id=&quot;o-le&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;le&quot; min=&quot;20&quot; max=&quot;85&quot; step=&quot;0.5&quot; value=&quot;72&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Mean years of schooling (25+) &lt;output id=&quot;o-mys&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;mys&quot; min=&quot;0&quot; max=&quot;15&quot; step=&quot;0.1&quot; value=&quot;8.5&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Expected years of schooling &lt;output id=&quot;o-eys&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;eys&quot; min=&quot;0&quot; max=&quot;18&quot; step=&quot;0.1&quot; value=&quot;13&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;GNI per capita (PPP $) &lt;output id=&quot;o-gni&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;gni&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;1&quot; value=&quot;700&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;svg viewBox=&quot;0 0 400 230&quot; id=&quot;hdisvg&quot; role=&quot;img&quot; aria-label=&quot;HDI indices&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;I&lt;sub&gt;health&lt;/sub&gt; = (LE − 20)/(85 − 20) · I&lt;sub&gt;education&lt;/sub&gt; = mean of MYS/15 and EYS/18 · I&lt;sub&gt;income&lt;/sub&gt; = (ln GNI − ln 100)/(ln 75,000 − ln 100). The &lt;b&gt;geometric mean&lt;/b&gt; penalises imbalances: a country that is rich but has very poor health cannot compensate through income.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Western colonialism: “following in the footsteps of the West”&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;For a long time, definitions prevailed that saw development as &lt;b&gt;“following in the footsteps of the West”&lt;/b&gt; (Bernstein, cited in Thomas/Potter 1992: 119). The cartoon on the slide (Gillray, 1805: Pitt and Napoleon carving up the world like a pudding) is a reminder that this idea originated within colonial relations.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;
&lt;h4&gt;Menzel&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;For Ulrich Menzel, development consists of processes of &lt;i&gt;economic growth, industrialisation, social differentiation and mobilisation, mental change, democratisation and redistribution&lt;/i&gt;. These processes took place in Western Europe, North America and later East Asia, but not (or not fully) in the rest of the world. The task of theory would be to explain this &lt;b&gt;&lt;i&gt;lagging behind&lt;/i&gt;&lt;/b&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;note&lt;/span&gt; The cartoonist is not named on the slide. The image corresponds to &lt;i&gt;The Plumb-pudding in danger&lt;/i&gt; by James Gillray (1805): check against the material before citing it.&lt;/p&gt;

&lt;h3&gt;The problems with this concept of development&lt;/h3&gt;
&lt;p&gt;Open each critique (slide 22).&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1 · Eurocentrism (ethnocentrism)&lt;/summary&gt;&lt;div&gt;&lt;em class=&quot;t&quot;&gt;Ethnocentrism&lt;/em&gt;: judging other societies by the standards of one’s own. Europe and the West become the yardstick for everything, the finishing line to be reached.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2 · An oversimplified scheme&lt;/summary&gt;&lt;div&gt;An “all-too-simple” model of perception and explanation for very different social phenomena: a single ladder, a single path, for societies with different histories.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3 · Depoliticisation of problems&lt;/summary&gt;&lt;div&gt;The terminology implies that problems of &lt;b&gt;power, privilege and exclusion&lt;/b&gt; can be solved through “development” institutions and projects, i.e. through technical tools, without touching power relations.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4 · “Who could be against development?”&lt;/summary&gt;&lt;div&gt;Development is comfortable ground for donors, planning ministries, social groups and NGOs: nobody is against development. By contrast, it is hard to find support for political initiatives that expose national or international &lt;b&gt;conflicts&lt;/b&gt; and side with marginalised, exploited or oppressed groups.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;5 · Subalternity&lt;/summary&gt;&lt;div&gt;The distinction between «developed», «less developed» and «developing» countries creates a hierarchy. &lt;em class=&quot;t&quot;&gt;Subalternity&lt;/em&gt;: the condition of those placed in an inferior, voiceless position within a dominant order.&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;The critical chain: a single model generates hierarchy and conceals power&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;A single model:&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;the West&lt;/text&gt;
&lt;rect x=&quot;240&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;A single ladder:&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;“ahead” and “behind”&lt;/text&gt;
&lt;rect x=&quot;470&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;Hierarchy&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;developed / developing&lt;/text&gt;
&lt;rect x=&quot;700&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;795&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;Power and conflicts&lt;/text&gt;&lt;text x=&quot;795&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;remain invisible&lt;/text&gt;
&lt;g stroke=&quot;var(--muted)&quot; marker-end=&quot;url(#ah)&quot;&gt;&lt;path d=&quot;M210 100 H236&quot;/&gt;&lt;path d=&quot;M440 100 H466&quot;/&gt;&lt;path d=&quot;M670 100 H696&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;450&quot; y=&quot;180&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot; font-style=&quot;italic&quot;&gt;Eurocentrism → simplification → subalternity → depoliticisation&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · development&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;How was development measured, before and after?&lt;/summary&gt;&lt;div&gt;At first mainly through GNP (the World Bank’s World Development Reports), later also through formal education and life expectancy (the UNDP’s Human Development Index).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What does Menzel mean by “lagging behind”?&lt;/summary&gt;&lt;div&gt;The delay of countries in which growth, industrialisation, social differentiation, democratisation and redistribution have not taken place (fully) as they did in the West and East Asia. For him, development theory must explain this delay.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is it problematic to say “nobody is against development”?&lt;/summary&gt;&lt;div&gt;Because generic consensus conceals power conflicts. Technical projects are easily funded, but not initiatives that challenge privilege and side with oppressed groups.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is ethnocentrism as applied to development?&lt;/summary&gt;&lt;div&gt;Using one’s own society (here Europe/the West) as the model and yardstick for judging all others.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 7 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s7&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The turning point&lt;/div&gt;&lt;h2&gt;Inequality in the development debate: a paradigm change&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slides 23–27: three strategies, “A paradigm change”, “Reduce inequality / Ensure equity”, “Promote inclusion”, “Universal development goals”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;&lt;p&gt;If the concept of development has these limitations, how can it be corrected by placing &lt;b&gt;inequality&lt;/b&gt; at its centre? Following Freistein &amp;amp; Mahlert, the slides propose three routes.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Three strategies&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;r1&quot;&gt;1 · Radical break&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;r2&quot;&gt;2 · Smooth incorporation&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;r3&quot;&gt;3 · Fundamental reforms&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot; role=&quot;tabpanel&quot; id=&quot;r1&quot;&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; role=&quot;img&quot; aria-label=&quot;Radical break: development replaced by inequality&quot;&gt;&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--muted)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;70&quot; fill=&quot;var(--muted)&quot; text-decoration=&quot;line-through&quot;&gt;development&lt;/text&gt;&lt;path d=&quot;M230 65 H360&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;rect x=&quot;370&quot; y=&quot;35&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;465&quot; y=&quot;70&quot; fill=&quot;var(--ink)&quot;&gt;inequality&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;&lt;b&gt;Replacing&lt;/b&gt; “development” entirely with inequality concerns. According to the slides this is &lt;b&gt;unlikely and too radical&lt;/b&gt;: the vocabulary of development is too deeply embedded in institutions.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot; role=&quot;tabpanel&quot; id=&quot;r2&quot; hidden&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; role=&quot;img&quot; aria-label=&quot;Smooth incorporation: inequality added to development&quot;&gt;&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;150&quot; y=&quot;25&quot; width=&quot;300&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;58&quot; fill=&quot;var(--ink)&quot;&gt;development (institutional approach)&lt;/text&gt;&lt;rect x=&quot;235&quot; y=&quot;68&quot; width=&quot;130&quot; height=&quot;28&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;87&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;+ inequality&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;&lt;b&gt;Practices are modified&lt;/b&gt; by adding attention to inequalities, but the traditional institutional approach is &lt;b&gt;retained&lt;/b&gt;. Inequality is an add-on; it does not change the structure.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot; role=&quot;tabpanel&quot; id=&quot;r3&quot; hidden&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; role=&quot;img&quot; aria-label=&quot;Fundamental reforms: development reinterpreted through the lens of inequality&quot;&gt;&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;60&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;70&quot; fill=&quot;var(--ink)&quot;&gt;development&lt;/text&gt;&lt;circle cx=&quot;300&quot; cy=&quot;65&quot; r=&quot;34&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;70&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot;&gt;lens&lt;/text&gt;&lt;path d=&quot;M240 65 H262 M338 65 H370&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;rect x=&quot;372&quot; y=&quot;35&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;467&quot; y=&quot;62&quot; fill=&quot;var(--ink)&quot;&gt;development&lt;/text&gt;&lt;text x=&quot;467&quot; y=&quot;80&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;translated into equity terms&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;Neither a break nor a mere add-on: development commitments are &lt;b&gt;reformed&lt;/b&gt; by &lt;b&gt;translating&lt;/b&gt; them from the perspective of inequality. According to Freistein &amp;amp; Mahlert, this is the route the SDGs make possible.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;The paradigm change: inequality within the SDGs&lt;/h3&gt;
&lt;p&gt;With the SDGs, inequality is &lt;b&gt;systematically integrated&lt;/b&gt;: according to slide 24, &lt;b&gt;11 of the 17 goals&lt;/b&gt; address forms of inequality, in terms of reducing inequalities / equity, access to opportunities, or inclusion.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Reduce inequality / Ensure equity&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Goals &lt;b&gt;1, 3, 4, 5, 6, 7, 10&lt;/b&gt;. Key words: “for all”, “in all its forms”, “inclusive and equitable”, &lt;i&gt;availability&lt;/i&gt;, &lt;i&gt;access&lt;/i&gt;. &lt;b&gt;Goal 10&lt;/b&gt; is the only one explicitly devoted to inequality, “within and among countries”, i.e. both inside countries and between them.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Promote inclusion&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Goals &lt;b&gt;8, 9, 11, 16, 17&lt;/b&gt;. Key words: “inclusive” growth, “inclusive” industrialisation, “inclusive, safe, resilient” cities, “inclusive” societies and institutions, global partnership.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;note&lt;/span&gt; Caution: slides 25–26 list &lt;b&gt;12&lt;/b&gt; goals in total (7 + 5), whereas slide 24 speaks of &lt;b&gt;11&lt;/b&gt;. Check the count against the Freistein &amp;amp; Mahlert text or ask in class which goal is excluded. The year is also given in two ways: “2015” on slide 23, “2016” in the list of materials (the article appeared in &lt;i&gt;Third World Quarterly&lt;/i&gt; 37(12), 2016).&lt;/p&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Bar of the 17 goals coloured by group&quot; id=&quot;sdgbar&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;The 17 goals by group in slides 25–26: brick = equity, slate = inclusion, grey = not listed (2, 12, 13, 14, 15, all environmental or food-related).&lt;/figcaption&gt;
&lt;/div&gt;

&lt;h3&gt;Universal development goals&lt;/h3&gt;
&lt;p&gt;The deepest change: the SDGs are &lt;b&gt;universal&lt;/b&gt;, “pertaining to all countries (and individuals) alike”. Compare the two models.&lt;/p&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Model&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;u-old&quot; aria-pressed=&quot;true&quot;&gt;Old model&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;u-new&quot; aria-pressed=&quot;false&quot;&gt;SDG model&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Comparison between the hierarchical North–South model and the universal model&quot; id=&quot;univ&quot;&gt;
&lt;g id=&quot;u-oldg&quot;&gt;
&lt;rect x=&quot;300&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; fill=&quot;var(--ink)&quot;&gt;Global North · “developed”&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;its own problems invisible&lt;/text&gt;
&lt;path d=&quot;M450 82 V160&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;125&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;aid, models, projects&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;165&quot; width=&quot;400&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; fill=&quot;var(--ink)&quot;&gt;Global South · “developing / less developed”&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;211&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;“inferior world-societal status”&lt;/text&gt;
&lt;/g&gt;
&lt;g id=&quot;u-newg&quot; style=&quot;display:none&quot;&gt;
&lt;circle cx=&quot;450&quot; cy=&quot;130&quot; r=&quot;110&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
&lt;text x=&quot;450&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--slate)&quot;&gt;the same 17 goals for all&lt;/text&gt;
&lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
&lt;circle cx=&quot;390&quot; cy=&quot;110&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;390&quot; y=&quot;114&quot;&gt;Italy&lt;/text&gt;
&lt;circle cx=&quot;510&quot; cy=&quot;110&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;114&quot;&gt;Nigeria&lt;/text&gt;
&lt;circle cx=&quot;390&quot; cy=&quot;180&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;390&quot; y=&quot;184&quot;&gt;USA&lt;/text&gt;
&lt;circle cx=&quot;510&quot; cy=&quot;180&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;184&quot;&gt;India&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;620&quot; y=&quot;120&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;“inclusive”, “equitable”, “for all”,&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;138&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;“in all its forms”&lt;/text&gt;
&lt;text x=&quot;110&quot; y=&quot;120&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;the North also has development&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;138&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;problems (e.g. obesity, inequality)&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;The semantics of “inclusive”, “equitable”, “equal”, “by/for all”, “in all its forms” mark a &lt;b&gt;turn towards equality&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;All goals concerning individual outcomes (education, poverty, food, health, sanitation, energy, growth, urban infrastructure) are framed to be &lt;b&gt;inclusive or equitable&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;This is an important step towards overcoming the colonial tendency to assign countries of the Global South an &lt;b&gt;“inferior world-societal status”&lt;/b&gt;, a tendency that also concealed the long-standing development problems of the wealthy Global North.&lt;/li&gt;
&lt;/ul&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · inequality and the SDGs&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Describe the three strategies for including inequality in the development debate.&lt;/summary&gt;&lt;div&gt;(1) &lt;b&gt;Radical break&lt;/b&gt;: replacing “development” with “inequality”, unlikely and too radical. (2) &lt;b&gt;Smooth incorporation&lt;/b&gt;: adding attention to inequality while retaining the traditional institutional approach. (3) &lt;b&gt;Fundamental reforms&lt;/b&gt;: translating development commitments from the perspective of inequality (Freistein &amp;amp; Mahlert).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Which is the only goal explicitly devoted to inequality, and what does “within and among countries” mean?&lt;/summary&gt;&lt;div&gt;Goal 10. “Within” refers to inequalities inside each country (between rich and poor, men and women…), “among” to those between countries.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Why is the universality of the SDGs a break with the colonial past?&lt;/summary&gt;&lt;div&gt;Because the goals apply to all countries and all people: the South is no longer placed in an inferior position as something “to be developed”, and the North must acknowledge its own development problems.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between “availability” (Goal 6) and “access” (Goal 7)?&lt;/summary&gt;&lt;div&gt;Availability: the resource exists and is managed sustainably. Access: people are actually able to obtain it (cost, distance, discrimination). Inequality often lies in the gap between the two.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 8 --&gt;
&lt;section class=&quot;part&quot; id=&quot;s8&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The big picture&lt;/div&gt;&lt;h2&gt;Connections with the rest of the module&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; syllabus on slide 3 and materials on slide 4 of this lecture.&lt;/p&gt;
&lt;p&gt;Today’s concepts are the tools for the following lectures. Click a topic to see which of today’s ideas you will need.&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Connections&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;c1&quot;&gt;Social differences&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c2&quot;&gt;Demography&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c3&quot;&gt;Gender&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c4&quot;&gt;Poverty&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c5&quot;&gt;Migration&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c6&quot;&gt;Values&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c1&quot;&gt;&lt;b&gt;Unequal access to opportunities.&lt;/b&gt; Draws on the sociological perspective (position in society) and the “access / inclusion” vocabulary of goals 6–7–8–11. Goal 10 “within and among countries”.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c2&quot; hidden&gt;&lt;b&gt;Intergenerational conflicts.&lt;/b&gt; Draws on the 2030 Agenda’s idea of development “now and into the future” and Goal 3 “for all at all ages”.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c3&quot; hidden&gt;&lt;b&gt;Gender inequalities.&lt;/b&gt; Goal 5. Reading: Kabeer (2015). Applies the critique of development: even “neutral” models of poverty can conceal gender differences.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c4&quot; hidden&gt;&lt;b&gt;Poverty, stratification, mobility.&lt;/b&gt; Goals 1 and 8. Draws on the GNP vs HDI discussion and the critique of growth as the sole goal of development.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c5&quot; hidden&gt;&lt;b&gt;Environmental migration.&lt;/b&gt; “Refugee crisis” and “migration” are among the social problems (slide 15); climate links back to section 4. Reading: Nijenhuis &amp;amp; Leung (2017), de-territorialised development.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c6&quot; hidden&gt;&lt;b&gt;Values, solidarity, cohesion.&lt;/b&gt; The definition of a social problem requires shared values (slide 13); see also the “collective vs individual responsibility” of slide 2. Reading: Horlings (2015).&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;note&lt;/span&gt; The connections are based on the syllabus on slide 3. The other files in the &lt;code&gt;corso/&lt;/code&gt; folder could not be accessed with the tools available in this session, so none of them were used here.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- fonti --&gt;
&lt;section class=&quot;part refs&quot; id=&quot;fonti&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;External sources&lt;/div&gt;&lt;h2&gt;Further reading&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Each entry concerns an author, text or website cited in the slides. The descriptions come from web searches: they are &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt; and not lecture content.&lt;/p&gt;

&lt;h3&gt;Exam readings (slide 4)&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Freistein, K. &amp;amp; Mahlert, B. (2016). The potential for tackling inequality in the Sustainable Development Goals&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Third World Quarterly&lt;/i&gt;, 37(12), 2139–2155. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: an analysis of the explicit and implicit inequality goals in the SDGs. The SDGs go far beyond previous goals in treating inequality as a central issue, albeit in vague terms. The authors ask whether they can become “discursive resources” for fundamental reforms of ideas of development. &lt;b&gt;Why it matters:&lt;/b&gt; it underpins sections 6–7 (three strategies, fundamental reforms).&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1080/01436597.2016.1166945&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher DOI&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/taf/ctwqxx/v37y2016i12p2139-2155.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;abstract on IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Kabeer, N. (2015). Gender, poverty, and inequality: a brief history of feminist contributions in the field of international development&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Gender &amp;amp; Development&lt;/i&gt;, 23(2), 189–205. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: a review of feminist work on gender, poverty and inequality in development studies, from the micro to the macro level, including the confusions that persist between the three concepts. &lt;b&gt;Why it matters:&lt;/b&gt; it prepares the lecture on gender inequalities and shows a limitation of “neutral” poverty measures, which treat the household as a single unit.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1080/13552074.2015.1062300&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher DOI&lt;/a&gt; · &lt;a href=&quot;https://policy-practice.oxfam.org/resources/gender-poverty-and-inequality-a-brief-history-of-feminist-contributions-in-the-560889/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;copy on Oxfam Policy &amp;amp; Practice&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Nijenhuis, G. &amp;amp; Leung, M. (2017). Rethinking Migration in the 2030 Agenda: Towards a De-Territorialized Conceptualization of Development&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Forum for Development Studies&lt;/i&gt;, 44(1), 51–68. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: an analysis of how the 2030 Agenda deals with migration, which was almost absent from the MDGs. The argument is that the Agenda remains tied to a place-based view of development and fails to capture the translocal nature of the global economy. &lt;b&gt;Why it matters:&lt;/b&gt; it applies the critique of the concept of development (section 6) to migration.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1080/08039410.2016.1276958&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher DOI&lt;/a&gt; · &lt;a href=&quot;https://research-portal.uu.nl/en/publications/rethinking-migration-in-the-2030-agenda-towards-a-de-territoriali/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Utrecht University research portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Horlings, L. G. (2015). The inner dimension of sustainability: Personal and cultural values&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Current Opinion in Environmental Sustainability&lt;/i&gt;, 14, 163–169. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: the argument that the transformation towards sustainability requires a change in values, its “inner dimension”. It distinguishes between personal values and collective cultural values and asks how values differ from beliefs, attitudes and worldviews. &lt;b&gt;Why it matters:&lt;/b&gt; groundwork for the lecture on human values and for the individual/collective tension.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1016/j.cosust.2015.06.006&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Publisher DOI&lt;/a&gt; · &lt;a href=&quot;https://research.rug.nl/en/publications/the-inner-dimension-of-sustainability-personal-and-cultural-value/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Groningen research portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Video «Mapping Planetary AI» · Kate Crawford&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;State Library Victoria, “For Future Reference” lecture, 5 December 2024. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: a conversation with Kate Crawford, author of &lt;i&gt;Atlas of AI&lt;/i&gt;, on the infrastructures of artificial intelligence and the “technological empires” that produce it. A transcript is available on the library’s website. &lt;b&gt;Why it matters:&lt;/b&gt; it presents technology as a social and material phenomenon, tied to power, labour and the environment; in other words, the sociological perspective applied to a current topic.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=0PqrZ2lqT70&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt; · &lt;a href=&quot;https://lab.slv.vic.gov.au/experiments/ai-ethics-policy-research/mapping-planetary-ai-kate-crawford&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;SLV transcript&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Authors and texts cited&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;C. Wright Mills (1959). The Sociological Imagination&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Oxford University Press. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: the distinction between &lt;i&gt;personal troubles&lt;/i&gt;, which lie within the character of the individual and their immediate relations, and &lt;i&gt;public issues&lt;/i&gt;, which concern the organisation of institutions and the social structure. The sociologist’s task is to connect biography and history. &lt;b&gt;Why it matters:&lt;/b&gt; it is the foundation of sections 2–3.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://csus.edu/indiv/m/monkd/sociological_imagination.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annotated excerpt (California State University, Sacramento)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;W. W. Rostow (1960). The Stages of Economic Growth: A Non-Communist Manifesto&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Cambridge University Press. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: the five stages, from traditional society to mass consumption. Critics have described the stages as “empty boxes”, difficult to verify empirically. &lt;b&gt;Why it matters:&lt;/b&gt; it is the classic example of the evolutionary, Western-centric view of development criticised on slides 20–22.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.cambridge.org/core/books/the-stages-of-economic-growth/9CB46055035A1915509CE15A57848A07&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bernstein, cited in Thomas &amp;amp; Potter (1992)&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;A. Thomas &amp;amp; D. Potter, “Development, capitalism and the nation state”, in T. Allen &amp;amp; A. Thomas (eds.), &lt;i&gt;Poverty and Development in the 1990s&lt;/i&gt;, Oxford University Press / Open University, 1992. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: an Open University textbook on development, in the section on the formation of the “Third World”. In the subsequent edition Henry Bernstein authored the chapter “Colonialism, capitalism, development”. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the phrase “following in the footsteps of the West” (p. 119). The exact page reference has not been verified online.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/8049&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;LSE record of the 2000 edition (which builds on the 1992 edition)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ulrich Menzel · Das Ende der Dritten Welt und das Scheitern der großen Theorie (1992)&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Suhrkamp, Frankfurt am Main. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: the argument that the “Third World” is a constructed category and that the grand theories of development (modernisation and dependency) have lost their explanatory power. Menzel does not deny that development problems exist. &lt;b&gt;Why it matters:&lt;/b&gt; the slides cite his definition of development and the idea of “lagging behind”. The slide does not indicate which work is being cited.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Ulrich_Menzel&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry (bibliography)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Institutions, indices and data&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UN · 2030 Agenda and sdgs.un.org&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Resolution A/RES/70/1, “Transforming our world: the 2030 Agenda for Sustainable Development” (2015). &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: the declaration, the 17 goals and 169 targets, and the principles of universality and “leave no one behind”. &lt;b&gt;Why it matters:&lt;/b&gt; it is the original text from which the slides quote the goals.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://sdgs.un.org/goals&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sdgs.un.org/goals&lt;/a&gt; · &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;text of the resolution&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UNDP · Human Development Index&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Human Development Report Office. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: the technical notes setting out the three dimensions (health, knowledge, income), the goalposts and the geometric mean. &lt;b&gt;Why it matters:&lt;/b&gt; it is the tool that marks the shift from growth to human development (slide 20). The calculator in section 6 is based on these notes.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HDR 2025 Technical Notes&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;World Bank · World Development Report&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Annual report since 1978. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: each year, a central development theme (poverty, equity, the role of the state, the environment…). The first issue was titled “Prospects for Growth and Alleviation of Poverty”. &lt;b&gt;Why it matters:&lt;/b&gt; it is the slides’ example of development measured by GNP.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/World_Development_Report&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Wikipedia entry&lt;/a&gt; · &lt;a href=&quot;https://www.worldbank.org/wdr&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldbank.org/wdr&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;WHO · Overweight and obesity (WHO, 2016b)&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Global Health Observatory. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: age-standardised estimates of overweight (BMI ≥ 25) and obesity (BMI ≥ 30) among adults aged 18+. &lt;b&gt;Why it matters:&lt;/b&gt; it is the source of the table on slide 11. The specific “2016b” document has not been identified.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.who.int/data/gho/data/themes/topics/indicator-groups/indicator-group-details/GHO/overweight-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WHO GHO · overweight &amp;amp; obesity&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UNICEF (2016) · The State of the World’s Children 2016: A fair chance for every child&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;UNICEF annual report. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: data on child mortality and a central theme, inequity. The report estimates 69 million under-five deaths by 2030 if the most disadvantaged children do not receive more attention. &lt;b&gt;Why it matters:&lt;/b&gt; it is the likely source of the table on slide 14. The slide only states “UNICEF, 2016”.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.unicef.cn/en/media/7801/file/The%20State%20of%20the%20World%27s%20Children%202016.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PDF of the report&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;DominoES project (PIK + GESIS)&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Leibniz Association. &lt;span class=&quot;badge b-ext&quot;&gt;external source&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contents: research on the chain from climate tipping elements (the Antarctic and Greenland ice sheets) to social tipping in public opinion and climate policy. &lt;b&gt;Why it matters:&lt;/b&gt; it is the interdisciplinarity example on slide 16.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.gesis.org/en/research/projects-and-exchange/external-funding-projects/details/project/42/domino-effects-in-the-earth-system&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GESIS project page&lt;/a&gt; · &lt;a href=&quot;https://arxiv.org/abs/1911.10063v2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;arXiv paper&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

[15,&quot;Life on land&quot;,&quot;#56C02B&quot;,&quot;none&quot;,&quot;Protect, restore and promote sustainable use of terrestrial ecosystems, sustainably manage forests, combat desertification, and halt and reverse land degradation and halt biodiversity loss.&quot;,0],
[16,&quot;Peace, justice and strong institutions&quot;,&quot;#00689D&quot;,&quot;inc&quot;,&quot;Promote peaceful and inclusive societies for sustainable development, provide access to justice for all and build effective, accountable and inclusive institutions at all levels.&quot;,1],

/* 6 · HDI */
function gniVal(v){return Math.round(Math.exp(Math.log(100)+v/1000*(Math.log(120000)-Math.log(100))))}
var hs=$(&quot;#hdisvg&quot;);
function hdi(){
  var le=+$(&quot;#le&quot;).value,mys=+$(&quot;#mys&quot;).value,eys=+$(&quot;#eys&quot;).value,g=gniVal(+$(&quot;#gni&quot;).value);

  var h=Math.cbrt(Math.max(ih,0)*ie*ii),ar=(ih+ie+ii)/3;
  $(&quot;#o-le&quot;).textContent=le.toFixed(1);$(&quot;#o-mys&quot;).textContent=mys.toFixed(1);$(&quot;#o-eys&quot;).textContent=eys.toFixed(1);$(&quot;#o-gni&quot;).textContent=g.toLocaleString(&quot;en-GB&quot;)+&quot; $&quot;;
  while(hs.firstChild)hs.removeChild(hs.firstChild);
  [[&quot;Health&quot;,ih,&quot;var(--sage)&quot;],[&quot;Education&quot;,ie,&quot;var(--slate)&quot;],[&quot;Income&quot;,ii,&quot;var(--ochre)&quot;],[&quot;HDI&quot;,h,&quot;var(--accent)&quot;]].forEach(function(r,k){
    var y=15+k*48;hs.appendChild(el(&quot;text&quot;,{x:0,y:y+20,&quot;font-size&quot;:14,fill:&quot;var(--ink)&quot;,&quot;font-weight&quot;:k===3?700:400},r[0]));
    hs.appendChild(el(&quot;rect&quot;,{x:95,y:y+4,width:240,height:22,rx:4,fill:&quot;var(--rule)&quot;,opacity:.5}));

    hs.appendChild(el(&quot;text&quot;,{x:342,y:y+20,&quot;font-size&quot;:14,fill:&quot;var(--ink)&quot;},r[1].toFixed(3)));
  });
  var cat=h&gt;=.8?&quot;Very high&quot;:h&gt;=.7?&quot;High&quot;:h&gt;=.55?&quot;Medium&quot;:&quot;Low&quot;;
  hs.appendChild(el(&quot;text&quot;,{x:0,y:222,&quot;font-size&quot;:12,fill:&quot;var(--muted)&quot;},cat+&quot; level · the arithmetic mean would be &quot;+ar.toFixed(3)));
}
[&quot;le&quot;,&quot;mys&quot;,&quot;eys&quot;,&quot;gni&quot;].forEach(function(id){$(&quot;#&quot;+id).addEventListener(&quot;input&quot;,hdi)});hdi();
