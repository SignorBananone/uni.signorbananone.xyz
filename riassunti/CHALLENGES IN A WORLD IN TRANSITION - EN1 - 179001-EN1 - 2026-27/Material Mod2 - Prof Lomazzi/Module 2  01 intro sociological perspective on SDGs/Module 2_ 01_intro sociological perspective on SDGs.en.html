&lt;section class=&quot;part&quot; id=&quot;s1&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The module&lt;/div&gt;&lt;h2&gt;What this module will do&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slides 1–4: title, “The goal of this module”, “What are we going to do”, “Material”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Goal.&lt;/b&gt; To adopt a &lt;em class=&quot;t&quot;&gt;sociological perspective&lt;/em&gt; (viewing phenomena as products of social relations, structures and institutions, not only of individual choices) in order to discuss the &lt;b&gt;social dimensions&lt;/b&gt; of sustainability problems.&lt;/div&gt;
&lt;p&gt;Six questions run through the whole module. Keep them in mind: they come back in every lecture.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Unequal power relations&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Who decides what counts as “development” or as a “problem”?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Uneven development&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Unequal development between and within countries (Global North and South, core and periphery).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Justice&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Questions of justice: who bears the costs of the environmental crisis and who enjoys the benefits.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Gender&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Gender inequalities as a cross-cutting dimension (see Kabeer 2015).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Generations&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Intergenerational relations: debt, pensions, an “inherited” climate.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Collective vs individual responsibility&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Is it enough to change individual behaviour?&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Quick glossary of the block 2 topics&lt;/summary&gt;&lt;div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Intersection of inequalities&lt;/em&gt; (intersectionality): inequalities of gender, class, age and ethnicity do not simply add up; they combine and produce specific disadvantages.&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Intergenerational conflicts&lt;/em&gt;: tensions between generations over the use of resources (welfare, environment, labour).&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Social stratification&lt;/em&gt;: the division of society into hierarchical strata (income, education, prestige). &lt;em class=&quot;t&quot;&gt;Social mobility&lt;/em&gt;: the possibility of moving between these strata.&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Environmental migration&lt;/em&gt;: movements of people caused or accelerated by environmental change (drought, sea-level rise, disasters).&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Individualistic vs collectivistic values&lt;/em&gt;: values centred on individual autonomy or on the group and solidarity.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Self-check · the module&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;What does it mean to study the “social dimensions” of sustainability?&lt;/summary&gt;&lt;div&gt;It means asking who is involved, who holds power, who gains and who loses: looking at inequalities, justice, gender, generations and responsibility, not only at technical or environmental aspects.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;What is the difference between the two blocks of the syllabus?&lt;/summary&gt;&lt;div&gt;Block 1 offers a critical reading of the SDGs as an overall framework. Block 2 examines six forms of &lt;em&gt;global social inequalities&lt;/em&gt; in depth (social differences, demography, gender, poverty and stratification, migration, values).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 2 --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;The method&lt;/div&gt;&lt;h2&gt;What it means to “use a sociological perspective”&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slides 5–11: definition of sociology, “Thinking like a sociologist”, individual vs sociological perspective, WHO table.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;blockquote&gt;It’s the systematic study of human behaviour, social interaction, social institutions, and society.&lt;cite&gt;Definition of sociology, slide 6&lt;/cite&gt;&lt;/blockquote&gt;
&lt;p&gt;There are four key words: &lt;b&gt;behaviour&lt;/b&gt;, &lt;b&gt;interaction&lt;/b&gt;, &lt;b&gt;institutions&lt;/b&gt; (school, family, market, state) and &lt;b&gt;society&lt;/b&gt;. “Systematic” means methodical: data, comparisons and theories, not impressions.&lt;/p&gt;
&lt;p&gt;Sociologists study &lt;em class=&quot;t&quot;&gt;patterns of behavior&lt;/em&gt; (recurring regularities in behaviour) in order to reach general conclusions that &lt;b&gt;go beyond&lt;/b&gt; the effect of a problem on a single person. This does not mean the individual is irrelevant: the focus, however, is on how individuals relate to others, on their &lt;b&gt;position&lt;/b&gt; in society and on the &lt;b&gt;interdependence&lt;/b&gt; between society and individuals.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Social problem, not personal trouble&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The concern is with what affects many people, not with one person’s private circumstances.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Societal relevance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;The concern is with what matters to society as a whole: values, institutions, policies.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
