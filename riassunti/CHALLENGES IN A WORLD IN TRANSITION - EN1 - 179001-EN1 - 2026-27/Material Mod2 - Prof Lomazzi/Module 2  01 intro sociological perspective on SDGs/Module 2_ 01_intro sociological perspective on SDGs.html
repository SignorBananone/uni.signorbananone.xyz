&lt;p class=&quot;small&quot;&gt;Leggi la mappa così: la lezione fornisce un &lt;b&gt;metodo&lt;/b&gt; (la prospettiva sociologica, che trasforma i problemi personali in problemi pubblici e chiede interdisciplinarità) e lo applica a un &lt;b&gt;oggetto&lt;/b&gt; (gli SDGs, che ripensano il concetto di &lt;em&gt;development&lt;/em&gt; mettendo al centro la disuguaglianza).&lt;/p&gt;

&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Il modulo&lt;/div&gt;&lt;h2&gt;Che cosa farà questo modulo&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 1–4: titolo, “The goal of this module”, “What are we going to do”, “Material”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Obiettivo.&lt;/b&gt; Adottare una &lt;em class=&quot;t&quot;&gt;sociological perspective&lt;/em&gt; (prospettiva sociologica: guardare ai fenomeni come prodotti di relazioni, strutture e istituzioni sociali, non solo di scelte individuali) per discutere le &lt;b&gt;dimensioni sociali&lt;/b&gt; dei problemi di sostenibilità.&lt;/div&gt;
&lt;p&gt;Le domande che attraversano tutto il modulo sono sei. Tienile a mente: ritornano in ogni lezione.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid3&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Unequal power relations&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Rapporti di potere diseguali: chi decide che cosa conta come “sviluppo” o come “problema”?&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Uneven development&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Sviluppo diseguale tra Paesi e dentro i Paesi (Nord e Sud globale, centro e periferia).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Justice&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Questioni di giustizia: chi paga i costi della crisi ambientale e chi ne gode i benefici.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Gender&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Le disuguaglianze di genere come dimensione trasversale (vedi Kabeer 2015).&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Generations&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Rapporti tra generazioni: debito, pensioni, clima “ereditato”.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Collective vs individual responsibility&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Responsabilità collettiva o individuale: basta cambiare i comportamenti dei singoli?&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;details&gt;&lt;summary&gt;Glossario rapido dei temi del blocco 2&lt;/summary&gt;&lt;div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Intersection of inequalities&lt;/em&gt; (intersezionalità): le disuguaglianze di genere, classe, età ed etnia non si sommano soltanto, si combinano e producono svantaggi specifici.&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Intergenerational conflicts&lt;/em&gt;: tensioni tra generazioni sull’uso delle risorse (welfare, ambiente, lavoro).&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Social stratification&lt;/em&gt;: la divisione della società in strati gerarchici (reddito, istruzione, prestigio). &lt;em class=&quot;t&quot;&gt;Social mobility&lt;/em&gt;: la possibilità di muoversi tra questi strati.&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Environmental migration&lt;/em&gt;: spostamenti di persone causati o accelerati da cambiamenti ambientali (siccità, innalzamento del mare, disastri).&lt;/li&gt;
&lt;li&gt;&lt;em class=&quot;t&quot;&gt;Individualistic vs collectivistic values&lt;/em&gt;: valori centrati sull’autonomia del singolo oppure sul gruppo e sulla solidarietà.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · il modulo&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa studiare le “social dimensions” della sostenibilità?&lt;/summary&gt;&lt;div&gt;Significa chiedersi chi è coinvolto, chi ha potere, chi guadagna e chi perde: guardare a disuguaglianze, giustizia, genere, generazioni e responsabilità, non solo agli aspetti tecnici o ambientali.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è la differenza tra i due blocchi del programma?&lt;/summary&gt;&lt;div&gt;Il blocco 1 legge criticamente gli SDGs come quadro generale. Il blocco 2 approfondisce sei forme di &lt;em&gt;global social inequalities&lt;/em&gt; (differenze sociali, demografia, genere, povertà e stratificazione, migrazioni, valori).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

&lt;!-- 2 --&gt;
&lt;section class=&quot;part sage&quot; id=&quot;s2&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Il metodo&lt;/div&gt;&lt;h2&gt;Che cosa vuol dire “usare una prospettiva sociologica”&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 5–11: definizione di sociologia, “Thinking like a sociologist”, individual vs sociological perspective, tabella WHO.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;blockquote&gt;It’s the systematic study of human behaviour, social interaction, social institutions, and society.&lt;cite&gt;Definizione di sociologia, slide 6&lt;/cite&gt;&lt;/blockquote&gt;
&lt;p&gt;Le parole chiave sono quattro: &lt;b&gt;comportamento&lt;/b&gt;, &lt;b&gt;interazione&lt;/b&gt;, &lt;b&gt;istituzioni&lt;/b&gt; (scuola, famiglia, mercato, Stato) e &lt;b&gt;società&lt;/b&gt;. “Systematic” vuol dire con metodo: dati, confronti, teorie, non impressioni.&lt;/p&gt;
&lt;p&gt;I sociologi studiano &lt;em class=&quot;t&quot;&gt;patterns of behavior&lt;/em&gt; (regolarità ricorrenti di comportamento) per arrivare a conclusioni generali che &lt;b&gt;vanno oltre&lt;/b&gt; l’effetto di un problema sul singolo. Questo non vuol dire che il singolo non conti: l’attenzione va però a come gli individui si relazionano agli altri, alla loro &lt;b&gt;posizione&lt;/b&gt; nella società e all’&lt;b&gt;interdipendenza&lt;/b&gt; tra società e individui.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;1 · Social problem, non personal trouble&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Interessa ciò che riguarda molte persone, non la vicenda privata di una sola.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;2 · Societal relevance&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Interessa ciò che ha rilevanza per la società nel suo insieme: valori, istituzioni, politiche.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Thinking like a sociologist: perché alcune persone sono obese?&lt;/h3&gt;
&lt;p&gt;La slide 8 propone una domanda semplice. Prova a classificare tu le spiegazioni: è una causa &lt;b&gt;individuale&lt;/b&gt; o &lt;b&gt;sociale&lt;/b&gt;?&lt;/p&gt;
&lt;div class=&quot;cls&quot; id=&quot;cls&quot;&gt;&lt;/div&gt;

&lt;figcaption&gt;Nella prospettiva sociologica John (USA) e Kaito (Giappone) non sono casi singoli: rappresentano ciò che è tipico del proprio contesto.&lt;/figcaption&gt;
&lt;/div&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Sociological imagination&lt;/b&gt; (immaginazione sociologica, C. Wright Mills): la capacità di collegare la biografia del singolo con la storia e la struttura della società in cui vive. Il peso di John si capisce davvero solo guardando anche a che cosa si mangia, si lavora e si guadagna negli Stati Uniti.&lt;/div&gt;

&lt;h3&gt;I dati: lo stesso fenomeno, contesti molto diversi&lt;/h3&gt;
&lt;p&gt;Le slide 11 e 14 riportano due tabelle per 19 Paesi: sovrappeso e obesità negli adulti (WHO, 2016b, dati 2014) e mortalità sotto i 5 anni (UNICEF, 2016, dati 2015). Scegli l’indicatore e sposta la soglia.&lt;/p&gt;
&lt;div class=&quot;figure&quot; id=&quot;chart&quot;&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Indicatore&quot;&gt;
&lt;button class=&quot;btn&quot; data-m=&quot;ow&quot; aria-pressed=&quot;true&quot;&gt;Overweight %&lt;/button&gt;

&lt;/div&gt;
&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;badge b-note&quot;&gt;nota&lt;/span&gt; Cosa vogliono dire “overweight” e “obesity”?&lt;/summary&gt;&lt;div&gt;
&lt;p&gt;Si usa il &lt;em class=&quot;t&quot;&gt;Body Mass Index&lt;/em&gt; (BMI, indice di massa corporea):&lt;/p&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.25rem;text-align:center&quot;&gt;BMI = peso (kg) ÷ altezza² (m²)&lt;/p&gt;
&lt;p&gt;Per l’OMS, negli adulti (18+), &lt;b&gt;overweight&lt;/b&gt; = BMI ≥ 25 e &lt;b&gt;obesity&lt;/b&gt; = BMI ≥ 30; gli obesi sono quindi un sottoinsieme dei sovrappeso. Per questo nella tabella la seconda colonna è sempre minore della prima. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; &lt;a href=&quot;https://www.who.int/data/gho/data/themes/topics/indicator-groups/indicator-group-details/GHO/overweight-obesity&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;WHO Global Health Observatory&lt;/a&gt;.&lt;/p&gt;
&lt;p&gt;&lt;em class=&quot;t&quot;&gt;Under-five mortality rate&lt;/em&gt;: probabilità di morire prima dei 5 anni, espressa ogni 1.000 nati vivi.&lt;/p&gt;
&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa ci insegnano i dati, da sociologi?&lt;/summary&gt;&lt;div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;Le differenze tra Paesi sono enormi (obesità 34,9% negli USA, 3,9% in Giappone, 3,5% in India): la genetica individuale non spiega scarti così grandi tra popolazioni.&lt;/li&gt;
&lt;li&gt;I Paesi con più obesità hanno in genere bassa mortalità infantile, e viceversa (Nigeria: 8,1% obesi, 107,5‰ morti sotto i 5 anni). Entrambi gli indicatori seguono il livello e il tipo di sviluppo: alimentazione, reddito, sanità.&lt;/li&gt;
&lt;li&gt;Il Giappone fa eccezione: ricco, eppure con poca obesità. Contano cultura alimentare, norme sociali, organizzazione urbana. È il “Kaito” della slide.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · prospettiva sociologica&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Spiega con un esempio la differenza tra individual e sociological perspective.&lt;/summary&gt;&lt;div&gt;Individuale: John è obeso perché mangia male, ha poco autocontrollo o una predisposizione genetica. Sociologica: negli USA l’obesità riguarda più di un adulto su tre, perché lì cibo, lavoro, trasporti e reddito favoriscono certi comportamenti. John è un caso &lt;em&gt;typical&lt;/em&gt; del suo contesto.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;I sociologi si disinteressano degli individui?&lt;/summary&gt;&lt;div&gt;No. La slide lo dice esplicitamente: l’enfasi è sulle relazioni tra individui, sulla loro posizione sociale e sull’interdipendenza tra società e individui.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa “systematic” nella definizione di sociologia?&lt;/summary&gt;&lt;div&gt;Che lo studio procede con metodo (raccolta di dati, confronto, generalizzazione), cercando &lt;em&gt;patterns&lt;/em&gt; e non aneddoti.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 3 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s3&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;03&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;L’oggetto&lt;/div&gt;&lt;h2&gt;Social problems: da personal trouble a public issue&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 12–15: “Social problems”, “Personal trouble and public issue”, tabella UNICEF, “Examples of social problems”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;La distinzione viene da &lt;b&gt;C. Wright Mills&lt;/b&gt;, &lt;i&gt;The Sociological Imagination&lt;/i&gt; (1959).&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Trouble o issue&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;t-trouble&quot;&gt;Personal trouble&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;t-issue&quot;&gt;Public issue&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot; role=&quot;tabpanel&quot; id=&quot;t-trouble&quot;&gt;&lt;h4&gt;Personal trouble · problema individuale&lt;/h4&gt;&lt;p&gt;Riguarda la persona e il suo ambiente immediato. &lt;b&gt;Esempio della slide:&lt;/b&gt; John è obeso.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;Si cerca la soluzione nella sfera privata: dieta, medico, forza di volontà.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot; role=&quot;tabpanel&quot; id=&quot;t-issue&quot; hidden&gt;&lt;h4&gt;Public issue · problema sociale&lt;/h4&gt;&lt;p&gt;Riguarda molte persone &lt;b&gt;e&lt;/b&gt; viene percepito come indesiderabile. &lt;b&gt;Esempio della slide:&lt;/b&gt; molte persone sono obese, e questo è considerato un male.&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;La soluzione richiede interventi collettivi: politiche alimentari, urbanistica, sanità pubblica.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Le due condizioni di un social problem&lt;/h3&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 270&quot; role=&quot;img&quot; aria-label=&quot;Diagramma di Venn: un social problem nasce dall&#x27;intersezione tra diffusione e conflitto con i valori&quot;&gt;
&lt;circle cx=&quot;370&quot; cy=&quot;135&quot; r=&quot;115&quot; fill=&quot;var(--ochre)&quot; fill-opacity=&quot;.18&quot; stroke=&quot;var(--ochre)&quot;/&gt;
&lt;circle cx=&quot;530&quot; cy=&quot;135&quot; r=&quot;115&quot; fill=&quot;var(--accent)&quot; fill-opacity=&quot;.14&quot; stroke=&quot;var(--accent)&quot;/&gt;
&lt;text x=&quot;310&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;Goes beyond&lt;/text&gt;
&lt;text x=&quot;310&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;the individual&lt;/text&gt;
&lt;text x=&quot;310&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;colpisce molte persone&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;115&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;Many people&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;137&quot; text-anchor=&quot;middle&quot; font-family=&quot;var(--serif)&quot; font-size=&quot;18&quot; fill=&quot;var(--ink)&quot;&gt;are concerned&lt;/text&gt;
&lt;text x=&quot;590&quot; y=&quot;162&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;contrasta con certi valori&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;132&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;SOCIAL&lt;/text&gt;
&lt;text x=&quot;450&quot; y=&quot;150&quot; text-anchor=&quot;middle&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot;&gt;PROBLEM&lt;/text&gt;
&lt;text x=&quot;90&quot; y=&quot;250&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;diffuso ma non visto come un male → fenomeno sociale&lt;/text&gt;
&lt;text x=&quot;560&quot; y=&quot;250&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;indigna ma tocca pochi → caso individuale&lt;/text&gt;
&lt;/svg&gt;
&lt;figcaption&gt;&lt;span class=&quot;badge b-note&quot;&gt;nota&lt;/span&gt; La seconda condizione rende il social problem in parte una &lt;b&gt;costruzione sociale&lt;/b&gt;: dipende dai valori di una società in un dato momento. Ciò che oggi è un problema (ad es. il bullismo) ieri poteva non esserlo.&lt;/figcaption&gt;
&lt;/div&gt;

&lt;h3&gt;Mortalità infantile: un public issue globale&lt;/h3&gt;
&lt;p&gt;La tabella UNICEF (slide 14) va letta così: un bambino che nasce in Nigeria ha una probabilità di morire prima dei 5 anni circa &lt;b&gt;36 volte&lt;/b&gt; più alta di uno nato in Giappone (107,5 contro 3,0 per mille). Nessuna spiegazione individuale regge a uno scarto simile. Puoi vedere tutti i valori nel grafico della sezione 2, indicatore “Under-5 mortality”.&lt;/p&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 140&quot; role=&quot;img&quot; aria-label=&quot;Pittogramma: morti sotto i 5 anni su 1000 nati in Giappone, Italia, Cina, India, Pakistan e Nigeria&quot;&gt;
&lt;g id=&quot;picto&quot;&gt;&lt;/g&gt;
&lt;/svg&gt;
&lt;figcaption&gt;Ogni quadratino = 1 morto ogni 1.000 nati vivi (valori arrotondati, dati UNICEF 2016 dalla slide 14).&lt;/figcaption&gt;
&lt;/div&gt;

&lt;h3&gt;Esempi di social problems&lt;/h3&gt;
&lt;p&gt;La slide 15 ne elenca 14. Filtra per scala per vedere come si distribuiscono: alcuni nascono nella vita quotidiana, altri sono globali.&lt;/p&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Filtro scala&quot; id=&quot;spf&quot;&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;Tutti&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;micro&quot; aria-pressed=&quot;false&quot;&gt;Vita quotidiana&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;meso&quot; aria-pressed=&quot;false&quot;&gt;Società nazionale&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;macro&quot; aria-pressed=&quot;false&quot;&gt;Globale&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;chips&quot; id=&quot;spchips&quot; style=&quot;margin-top:.8rem&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;nota&lt;/span&gt; La classificazione per scala è un aiuto alla lettura, non è nelle slide. Molti problemi stanno su più livelli: la migrazione, per esempio, è globale nelle cause e quotidiana nei suoi effetti.&lt;/p&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · social problems&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Quali due condizioni servono perché un fenomeno sia un social problem?&lt;/summary&gt;&lt;div&gt;(1) Va oltre l’individuo, cioè colpisce molte persone; (2) molte persone se ne preoccupano perché contrasta con certi valori.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;La disoccupazione di Maria è un personal trouble o un public issue?&lt;/summary&gt;&lt;div&gt;Presa da sola è un &lt;em&gt;personal trouble&lt;/em&gt;. Se il tasso di disoccupazione è alto (slide 15: “high unemployment rate”) diventa un &lt;em&gt;public issue&lt;/em&gt;: le cause sono strutturali (economia, mercato del lavoro) e la soluzione non può essere solo individuale. È l’esempio classico di Mills.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché “global warming and pollution” è tra i social problems di una lezione di sociologia?&lt;/summary&gt;&lt;div&gt;Perché ha cause sociali (consumi, produzione, politiche), colpisce i gruppi in modo diseguale e contrasta con valori condivisi (salute, giustizia verso le generazioni future). Serve però anche la prospettiva delle scienze naturali: vedi la sezione 4.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 4 --&gt;
&lt;section class=&quot;part ochre&quot; id=&quot;s4&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;04&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;La complessità&lt;/div&gt;&lt;h2&gt;Interdisciplinarity: il caso DominoES&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 16: “Interdisciplinarity”, schema DominoES (Interacting Tipping Elements).&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;La complessità dei problemi contemporanei richiede &lt;em class=&quot;t&quot;&gt;interdisciplinarity&lt;/em&gt; (interdisciplinarità: far lavorare insieme discipline diverse, ad esempio climatologia e sociologia, su una stessa domanda). L’esempio è la crisi climatica, letta dal progetto &lt;b&gt;DominoES&lt;/b&gt;, “Domino Effects in the Earth System: Can Antarctica tip climate policy?”.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Tipping element&lt;/b&gt; (elemento di non ritorno): una parte del sistema Terra che, superata una soglia (&lt;em&gt;tipping point&lt;/em&gt;), cambia stato in modo brusco e spesso irreversibile. Esempi: calotte di Groenlandia e Antartide, circolazione oceanica. Gli elementi &lt;b&gt;interagiscono&lt;/b&gt;: uno che “cade” può spingere gli altri, come in un domino.&lt;/div&gt;
&lt;/div&gt;
&lt;p&gt;Segui la catena passo per passo: lo schema unisce il sistema fisico (a sinistra) con quello sociale (a destra).&lt;/p&gt;
&lt;div class=&quot;figure steps&quot; data-cb=&quot;dominoStep&quot;&gt;

&lt;text x=&quot;695&quot; y=&quot;36&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; letter-spacing=&quot;2&quot; fill=&quot;var(--slate)&quot;&gt;SOCIAL SYSTEM&lt;/text&gt;
&lt;g fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;1.5&quot; marker-end=&quot;url(#ah)&quot;&gt;
&lt;path d=&quot;M150 88 L150 145&quot; data-s=&quot;1&quot;/&gt;

&lt;/g&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-n=&quot;0&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;48&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;75&quot; fill=&quot;var(--ink)&quot;&gt;Greenland Ice Sheet&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;1&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;148&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;168&quot; fill=&quot;var(--ink)&quot;&gt;Thermohaline&lt;/text&gt;&lt;text x=&quot;150&quot; y=&quot;184&quot; fill=&quot;var(--ink)&quot;&gt;ocean circulation&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;1&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;258&quot; width=&quot;220&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--sage)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;285&quot; fill=&quot;var(--ink)&quot;&gt;Antarctic Ice Sheet&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;2&quot;&gt;&lt;rect x=&quot;560&quot; y=&quot;48&quot; width=&quot;260&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;75&quot; fill=&quot;var(--ink)&quot;&gt;(anticipated) climate impacts&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;3&quot;&gt;&lt;rect x=&quot;590&quot; y=&quot;140&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;167&quot; fill=&quot;var(--ink)&quot;&gt;public opinion&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;3&quot;&gt;&lt;rect x=&quot;590&quot; y=&quot;228&quot; width=&quot;200&quot; height=&quot;44&quot; rx=&quot;22&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--slate)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;690&quot; y=&quot;255&quot; fill=&quot;var(--ink)&quot;&gt;climate policy&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;4&quot;&gt;&lt;rect x=&quot;280&quot; y=&quot;318&quot; width=&quot;240&quot; height=&quot;28&quot; rx=&quot;14&quot; fill=&quot;var(--accent-bg)&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;1.5&quot;/&gt;&lt;text x=&quot;400&quot; y=&quot;337&quot; fill=&quot;var(--ink)&quot;&gt;greenhouse gas emissions ↓↑&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;b&gt;1 · Il punto di partenza.&lt;/b&gt; Lo scioglimento della calotta della Groenlandia immette acqua dolce nell’oceano (&lt;em&gt;freshwater input&lt;/em&gt;).&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;2 · Domino fisico.&lt;/b&gt; L’acqua dolce rallenta la &lt;em class=&quot;t&quot;&gt;thermohaline circulation&lt;/em&gt; (circolazione oceanica guidata da temperatura e salinità). Questo modifica l’accumulo di calore nell’oceano australe e può destabilizzare la calotta antartica. Gli elementi sono &lt;b&gt;interacting&lt;/b&gt;.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;3 · Il ponte verso la società.&lt;/b&gt; Gli impatti climatici, anche solo &lt;b&gt;attesi&lt;/b&gt; (&lt;em&gt;anticipated&lt;/em&gt;), entrano nella percezione delle persone. Qui la domanda diventa sociologica.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;4 · Social tipping.&lt;/b&gt; L’opinione pubblica può a sua volta superare una soglia e spingere la &lt;em&gt;climate policy&lt;/em&gt;. La freccia tratteggiata nello schema originale indica che anche l’opinione pubblica influenza direttamente le emissioni (comportamenti).&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;5 · Il cerchio si chiude.&lt;/b&gt; La politica climatica agisce sulle emissioni di gas serra, che a loro volta spingono (o frenano) i tipping elements fisici. Senza scienze sociali il modello sarebbe incompleto: per questo serve l’interdisciplinarità.&lt;/div&gt;
&lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; DominoES era un progetto congiunto del Potsdam Institute for Climate Impact Research (PIK) e del GESIS – Leibniz Institute for the Social Sciences, finanziato dalla Leibniz Association (dal 2017). Un articolo collegato del gruppo sostiene che evitare i tipping “non voluti” potrebbe dipendere da una cascata di tipping sociali “voluti” (atteggiamenti, comportamenti, politiche). &lt;a href=&quot;https://www.gesis.org/en/research/projects-and-exchange/external-funding-projects/details/project/42/domino-effects-in-the-earth-system&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda GESIS&lt;/a&gt; · &lt;a href=&quot;https://arxiv.org/abs/1911.10063v2&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;articolo su arXiv&lt;/a&gt;.&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · interdisciplinarità&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Perché il cambiamento climatico richiede interdisciplinarità?&lt;/summary&gt;&lt;div&gt;Perché la catena causale passa sia per processi fisici (calotte, oceani) sia per processi sociali (opinione pubblica, politiche, emissioni). Nessuna disciplina da sola vede tutto il ciclo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa significa “anticipated” climate impacts?&lt;/summary&gt;&lt;div&gt;Che anche gli impatti attesi, non ancora avvenuti, possono cambiare opinioni e politiche. Conta la percezione sociale del rischio, non solo il danno già subito.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 5 --&gt;
&lt;section class=&quot;part slate&quot; id=&quot;s5&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;05&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;L’agenda globale&lt;/div&gt;&lt;h2&gt;Gli SDGs e l’Agenda 2030&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 17–18: “SDGs Goals”, “SDGs” (citazione da sdgs.un.org/goals); slide 25–26 per i testi dei goals.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;Nel &lt;b&gt;2015&lt;/b&gt; gli Stati membri dell’ONU adottano la &lt;em class=&quot;t&quot;&gt;2030 Agenda for Sustainable Development&lt;/em&gt;. Secondo l’ONU:&lt;/p&gt;
&lt;blockquote&gt;[It] provides a shared blueprint for peace and prosperity for people and the planet, now and into the future.&lt;cite&gt;sdgs.un.org/goals, citato a slide 18&lt;/cite&gt;&lt;/blockquote&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;Al centro ci sono &lt;b&gt;17 SDGs&lt;/b&gt;, “an urgent call for action” rivolta a &lt;b&gt;tutti&lt;/b&gt; i Paesi, sviluppati e in via di sviluppo, in una &lt;em class=&quot;t&quot;&gt;global partnership&lt;/em&gt; (partenariato globale: responsabilità condivisa).&lt;/li&gt;
&lt;li&gt;Porre fine alla povertà deve andare &lt;i&gt;hand-in-hand&lt;/i&gt; (di pari passo) con salute, istruzione, riduzione delle disuguaglianze e crescita economica, affrontando il cambiamento climatico e proteggendo oceani e foreste.&lt;/li&gt;
&lt;li&gt;Per la prof.ssa Lomazzi sono una &lt;b&gt;strategia globale contro le disuguaglianze&lt;/b&gt; unita a una &lt;b&gt;nuova idea di development&lt;/b&gt;. Questa frase fa da ponte alle sezioni 6 e 7.&lt;/li&gt;
&lt;/ul&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;ext&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Il documento è la risoluzione ONU &lt;b&gt;A/RES/70/1&lt;/b&gt;, “Transforming our world”, adottata al vertice di New York del 25–27 settembre 2015: 17 goals e &lt;b&gt;169 targets&lt;/b&gt; da raggiungere entro il 2030, con l’impegno di “leave no one behind”. Riprende i &lt;em&gt;Millennium Development Goals&lt;/em&gt; (MDGs, 2000–2015) per completare ciò che non avevano raggiunto. &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Testo della risoluzione (UN)&lt;/a&gt;.&lt;/div&gt;

&lt;h3&gt;I 17 goals: esplora&lt;/h3&gt;
&lt;p&gt;Clicca un goal per leggerne la formulazione. Con i filtri vedi come la prof.ssa raggruppa i goals legati alla disuguaglianza (slide 25–26, base: Freistein &amp;amp; Mahlert).&lt;/p&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Filtro goals&quot; id=&quot;sdgf&quot; style=&quot;margin-bottom:.8rem&quot;&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;Tutti&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;eq&quot; aria-pressed=&quot;false&quot;&gt;Reduce inequality / Ensure equity&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;inc&quot; aria-pressed=&quot;false&quot;&gt;Promote inclusion&lt;/button&gt;
&lt;button class=&quot;btn&quot; data-f=&quot;none&quot; aria-pressed=&quot;false&quot;&gt;Non elencati&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;sdg-grid&quot; id=&quot;sdg&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;card sdg-detail&quot; id=&quot;sdgd&quot; aria-live=&quot;polite&quot;&gt;&lt;span class=&quot;small&quot;&gt;Seleziona un goal.&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · SDGs&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;In che senso gli SDGs sono una “global partnership”?&lt;/summary&gt;&lt;div&gt;Riguardano tutti i Paesi, sviluppati e in via di sviluppo, che condividono la responsabilità degli obiettivi. Non sono più un programma dei Paesi ricchi per i Paesi poveri.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa vuol dire che gli obiettivi vanno “hand-in-hand”?&lt;/summary&gt;&lt;div&gt;Che sono interconnessi: non si elimina la povertà senza salute, istruzione e riduzione delle disuguaglianze, e la crescita economica deve convivere con la tutela del clima, degli oceani e delle foreste.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Quando e da chi è stata adottata l’Agenda 2030?&lt;/summary&gt;&lt;div&gt;Nel 2015, dagli Stati membri delle Nazioni Unite (risoluzione A/RES/70/1).&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 6 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s6&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;06&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;La critica&lt;/div&gt;&lt;h2&gt;Questioning the concept of «development»&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 19–22: “Questioning the concept”, “Concepts of development”, “Western colonialism”, “Problems”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;Domanda della slide 19: &lt;b&gt;che cosa vuol dire “development”?&lt;/b&gt; La parola sembra neutra e positiva, ma ha una storia, ed è proprio questa storia che gli SDGs provano a correggere.&lt;/p&gt;
&lt;div class=&quot;def&quot;&gt;&lt;b&gt;Development studies.&lt;/b&gt; Il campo di studi che nasce nel dopoguerra per spiegare e guidare il cambiamento dei Paesi “non sviluppati”. Il termine &lt;em class=&quot;t&quot;&gt;development&lt;/em&gt; indicava &lt;b&gt;processi evolutivi di cambiamento sociale&lt;/b&gt;, di solito associati a un miglioramento del tenore di vita.&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Un esempio di visione evolutiva: Rostow (1960)&lt;/h3&gt;
&lt;p&gt;La slide cita Rostow come esempio. La sua teoria immagina che tutte le società percorrano la stessa scala. Scorri gli stadi.&lt;/p&gt;
&lt;div class=&quot;figure steps&quot; data-cb=&quot;rostowStep&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 230&quot; role=&quot;img&quot; aria-label=&quot;Scala dei cinque stadi di Rostow&quot; id=&quot;rostow&quot;&gt;
&lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot;&gt;
&lt;g data-n=&quot;0&quot;&gt;&lt;rect x=&quot;20&quot; y=&quot;170&quot; width=&quot;160&quot; height=&quot;40&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;100&quot; y=&quot;195&quot;&gt;Traditional society&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;1&quot;&gt;&lt;rect x=&quot;190&quot; y=&quot;135&quot; width=&quot;160&quot; height=&quot;75&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;270&quot; y=&quot;160&quot;&gt;Preconditions&lt;/text&gt;&lt;text x=&quot;270&quot; y=&quot;176&quot;&gt;for take-off&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;2&quot;&gt;&lt;rect x=&quot;360&quot; y=&quot;100&quot; width=&quot;160&quot; height=&quot;110&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;440&quot; y=&quot;125&quot;&gt;Take-off&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;3&quot;&gt;&lt;rect x=&quot;530&quot; y=&quot;65&quot; width=&quot;160&quot; height=&quot;145&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;610&quot; y=&quot;90&quot;&gt;Drive to maturity&lt;/text&gt;&lt;/g&gt;
&lt;g data-n=&quot;4&quot;&gt;&lt;rect x=&quot;700&quot; y=&quot;30&quot; width=&quot;180&quot; height=&quot;180&quot; rx=&quot;6&quot;/&gt;&lt;text x=&quot;790&quot; y=&quot;55&quot;&gt;High mass&lt;/text&gt;&lt;text x=&quot;790&quot; y=&quot;71&quot;&gt;consumption&lt;/text&gt;&lt;/g&gt;
&lt;/g&gt;
&lt;path d=&quot;M30 150 C 300 140 600 60 870 15&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-dasharray=&quot;5 4&quot; marker-end=&quot;url(#ah)&quot;/&gt;
&lt;/svg&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;b&gt;1 · Traditional society.&lt;/b&gt; Economia agricola, tecnologia limitata, produttività bassa.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;2 · Preconditions for take-off.&lt;/b&gt; Si formano le basi: istituzioni, infrastrutture, imprenditori, scienza applicata.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;3 · Take-off.&lt;/b&gt; Il “decollo”: la crescita diventa continua, trainata da alcuni settori industriali.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;4 · Drive to maturity.&lt;/b&gt; La tecnologia si diffonde a tutta l’economia, che si diversifica.&lt;/div&gt;
&lt;div class=&quot;panel&quot; hidden&gt;&lt;b&gt;5 · Age of high mass consumption.&lt;/b&gt; Consumi di massa e beni durevoli. Il punto d’arrivo è il modello di Stati Uniti ed Europa occidentale: ecco l’idea di “seguire le orme dell’Occidente”.&lt;/div&gt;
&lt;div class=&quot;nav&quot;&gt;&lt;button class=&quot;btn prev&quot;&gt;← Indietro&lt;/button&gt;&lt;div class=&quot;dots&quot;&gt;&lt;/div&gt;&lt;button class=&quot;btn next&quot;&gt;Avanti →&lt;/button&gt;&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; I nomi degli stadi vengono da W. W. Rostow, &lt;i&gt;The Stages of Economic Growth: A Non-Communist Manifesto&lt;/i&gt;, Cambridge University Press, 1960 (&lt;a href=&quot;https://www.cambridge.org/core/books/the-stages-of-economic-growth/9CB46055035A1915509CE15A57848A07&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;scheda Cambridge&lt;/a&gt;). La slide cita solo l’autore.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Come cambiano obiettivi e misure&lt;/h3&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Obiettivi e misure&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;d-goal&quot;&gt;Che cosa si vuole&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;d-meas&quot;&gt;Come si misura&lt;/button&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;d-goal&quot;&gt;
&lt;div class=&quot;figure&quot;&gt;&lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Allargamento degli obiettivi dello sviluppo&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;30&quot; width=&quot;200&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;56&quot; fill=&quot;var(--ink)&quot;&gt;Economic growth&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;74&quot; fill=&quot;var(--ink)&quot;&gt;&amp;amp; industrialisation&lt;/text&gt;
&lt;rect x=&quot;240&quot; y=&quot;30&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;335&quot; y=&quot;65&quot; fill=&quot;var(--ink)&quot;&gt;Basic needs&lt;/text&gt;
&lt;rect x=&quot;460&quot; y=&quot;30&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;555&quot; y=&quot;65&quot; fill=&quot;var(--ink)&quot;&gt;Poverty reduction&lt;/text&gt;
&lt;rect x=&quot;680&quot; y=&quot;30&quot; width=&quot;210&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;785&quot; y=&quot;65&quot; fill=&quot;var(--ink)&quot;&gt;Sustainability&lt;/text&gt;
&lt;g stroke=&quot;var(--muted)&quot; marker-end=&quot;url(#ah)&quot;&gt;&lt;path d=&quot;M210 60 H236&quot;/&gt;&lt;path d=&quot;M430 60 H456&quot;/&gt;&lt;path d=&quot;M650 60 H676&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;110&quot; y=&quot;112&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;inizio della disciplina&lt;/text&gt;&lt;text x=&quot;785&quot; y=&quot;112&quot; font-size=&quot;11&quot; fill=&quot;var(--muted)&quot;&gt;→ SDGs&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;p&gt;All’inizio l’obiettivo è la &lt;b&gt;crescita economica e l’industrializzazione&lt;/b&gt;. Poi si allarga ai &lt;em class=&quot;t&quot;&gt;basic needs&lt;/em&gt; (bisogni di base: cibo, acqua, casa, salute, istruzione), alla &lt;b&gt;riduzione della povertà&lt;/b&gt; e infine alla &lt;b&gt;sostenibilità&lt;/b&gt;.&lt;/p&gt;
&lt;/div&gt;
&lt;div role=&quot;tabpanel&quot; id=&quot;d-meas&quot; hidden&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;GNP · World Bank&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;em class=&quot;t&quot;&gt;Gross National Product&lt;/em&gt; (prodotto nazionale lordo): il valore di beni e servizi prodotti dai residenti di un Paese, anche all’estero. È la misura dei &lt;i&gt;World Development Reports&lt;/i&gt; della Banca Mondiale. Misura solo la dimensione economica.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;HDI · UNDP&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;&lt;em class=&quot;t&quot;&gt;Human Development Index&lt;/em&gt;: aggiunge istruzione formale e aspettativa di vita. Lo sviluppo diventa sviluppo &lt;b&gt;umano&lt;/b&gt;, non solo crescita.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h4&gt;Prova l’HDI: quanto pesa una dimensione debole?&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; Formula e soglie (&lt;em&gt;goalposts&lt;/em&gt;) da &lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;UNDP, HDR Technical Notes&lt;/a&gt;. Le slide nominano l’indice senza spiegarne il calcolo.&lt;/p&gt;
&lt;div class=&quot;figure&quot; id=&quot;hdi&quot;&gt;
&lt;p style=&quot;font-family:var(--serif);font-size:1.15rem;text-align:center;margin-top:0&quot;&gt;HDI = ( I&lt;sub&gt;salute&lt;/sub&gt; × I&lt;sub&gt;istruzione&lt;/sub&gt; × I&lt;sub&gt;reddito&lt;/sub&gt; )&lt;sup&gt;1/3&lt;/sup&gt;&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div&gt;
&lt;label class=&quot;sl&quot;&gt;Aspettativa di vita (anni) &lt;output id=&quot;o-le&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;le&quot; min=&quot;20&quot; max=&quot;85&quot; step=&quot;0.5&quot; value=&quot;72&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Anni medi di istruzione (25+) &lt;output id=&quot;o-mys&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;mys&quot; min=&quot;0&quot; max=&quot;15&quot; step=&quot;0.1&quot; value=&quot;8.5&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;Anni attesi di istruzione &lt;output id=&quot;o-eys&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;eys&quot; min=&quot;0&quot; max=&quot;18&quot; step=&quot;0.1&quot; value=&quot;13&quot;&gt;&lt;/label&gt;
&lt;label class=&quot;sl&quot;&gt;GNI pro capite (PPP $) &lt;output id=&quot;o-gni&quot;&gt;&lt;/output&gt;&lt;input type=&quot;range&quot; id=&quot;gni&quot; min=&quot;0&quot; max=&quot;1000&quot; step=&quot;1&quot; value=&quot;700&quot;&gt;&lt;/label&gt;
&lt;/div&gt;
&lt;div&gt;&lt;svg viewBox=&quot;0 0 400 230&quot; id=&quot;hdisvg&quot; role=&quot;img&quot; aria-label=&quot;Indici HDI&quot;&gt;&lt;/svg&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;cap&quot;&gt;I&lt;sub&gt;salute&lt;/sub&gt; = (LE − 20)/(85 − 20) · I&lt;sub&gt;istruzione&lt;/sub&gt; = media di MYS/15 e EYS/18 · I&lt;sub&gt;reddito&lt;/sub&gt; = (ln GNI − ln 100)/(ln 75.000 − ln 100). La &lt;b&gt;media geometrica&lt;/b&gt; penalizza gli squilibri: un Paese ricco ma con salute pessima non può compensare con il reddito.&lt;/p&gt;
&lt;/div&gt;

&lt;h3&gt;Western colonialism: “following in the footsteps of the West”&lt;/h3&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;narrow&quot;&gt;
&lt;p&gt;Per molto tempo hanno dominato definizioni che vedevano lo sviluppo come &lt;b&gt;“seguire le orme dell’Occidente”&lt;/b&gt; (Bernstein, citato da Thomas/Potter 1992: 119). La vignetta della slide (Gillray, 1805, Pitt e Napoleone che si spartiscono il mondo come un budino) ricorda che quest’idea nasce dentro rapporti coloniali.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;
&lt;h4&gt;Menzel&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Per Ulrich Menzel lo sviluppo consiste in processi di &lt;i&gt;economic growth, industrialisation, social differentiation and mobilisation, mental change, democratisation and redistribution&lt;/i&gt;. Questi processi sono avvenuti in Europa occidentale, Nord America e poi Asia orientale, ma non (o non del tutto) nel resto del mondo. Il compito della teoria sarebbe spiegare questo &lt;b&gt;&lt;i&gt;lagging behind&lt;/i&gt;&lt;/b&gt; (ritardo).&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;nota&lt;/span&gt; L’autore della vignetta non è indicato nella slide. L’immagine corrisponde a &lt;i&gt;The Plumb-pudding in danger&lt;/i&gt; di James Gillray (1805): verifica sul materiale prima di citarla.&lt;/p&gt;

&lt;h3&gt;I problemi di questo concetto di development&lt;/h3&gt;
&lt;p&gt;Apri ogni critica (slide 22).&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;1 · Eurocentrism (ethnocentrism)&lt;/summary&gt;&lt;div&gt;&lt;em class=&quot;t&quot;&gt;Ethnocentrism&lt;/em&gt;: giudicare le altre società con i criteri della propria. L’Europa e l’Occidente diventano il metro di tutto, il traguardo da raggiungere.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;2 · Uno schema troppo semplice&lt;/summary&gt;&lt;div&gt;Un modello di percezione e spiegazione “all-too-simple” per fenomeni sociali molto diversi: una sola scala, un solo percorso, per società con storie diverse.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;3 · Depoliticizzazione dei problemi&lt;/summary&gt;&lt;div&gt;La terminologia lascia intendere che problemi di &lt;b&gt;potere, privilegio ed esclusione&lt;/b&gt; si possano risolvere con istituzioni e progetti di “sviluppo”, cioè con strumenti tecnici, senza toccare i rapporti di potere.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;4 · “Who could be against development?”&lt;/summary&gt;&lt;div&gt;Lo sviluppo è un terreno comodo per donatori, ministeri della pianificazione, gruppi sociali e ONG: nessuno è contro lo sviluppo. È invece difficile trovare sostegno per iniziative politiche che mettono in luce &lt;b&gt;conflitti&lt;/b&gt; nazionali o internazionali e che stanno dalla parte di gruppi marginalizzati, sfruttati od oppressi.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;5 · Subalternity&lt;/summary&gt;&lt;div&gt;La distinzione tra Paesi «developed», «less developed» e «developing» crea una gerarchia. &lt;em class=&quot;t&quot;&gt;Subalternity&lt;/em&gt; (subalternità): la condizione di chi è collocato in una posizione inferiore e senza voce dentro un ordine dominante.&lt;/div&gt;&lt;/details&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 200&quot; role=&quot;img&quot; aria-label=&quot;La catena critica: un solo modello genera gerarchia e nasconde il potere&quot;&gt;
&lt;g font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;
&lt;rect x=&quot;10&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;110&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;Un solo modello:&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;l’Occidente&lt;/text&gt;
&lt;rect x=&quot;240&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;340&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;Scala unica:&lt;/text&gt;&lt;text x=&quot;340&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;“avanti” e “indietro”&lt;/text&gt;
&lt;rect x=&quot;470&quot; y=&quot;60&quot; width=&quot;200&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;570&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;Gerarchia&lt;/text&gt;&lt;text x=&quot;570&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;developed / developing&lt;/text&gt;
&lt;rect x=&quot;700&quot; y=&quot;60&quot; width=&quot;190&quot; height=&quot;80&quot; rx=&quot;12&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;795&quot; y=&quot;95&quot; fill=&quot;var(--ink)&quot;&gt;Potere e conflitti&lt;/text&gt;&lt;text x=&quot;795&quot; y=&quot;113&quot; fill=&quot;var(--ink)&quot;&gt;restano invisibili&lt;/text&gt;
&lt;g stroke=&quot;var(--muted)&quot; marker-end=&quot;url(#ah)&quot;&gt;&lt;path d=&quot;M210 100 H236&quot;/&gt;&lt;path d=&quot;M440 100 H466&quot;/&gt;&lt;path d=&quot;M670 100 H696&quot;/&gt;&lt;/g&gt;
&lt;text x=&quot;450&quot; y=&quot;180&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot; font-style=&quot;italic&quot;&gt;Eurocentrism → semplificazione → subalternity → depoliticizzazione&lt;/text&gt;
&lt;/g&gt;&lt;/svg&gt;
&lt;/div&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · development&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Come si è misurato lo sviluppo, prima e dopo?&lt;/summary&gt;&lt;div&gt;Prima soprattutto con il GNP (World Development Reports della Banca Mondiale), poi anche con istruzione formale e aspettativa di vita (Human Development Index dell’UNDP).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cosa intende Menzel per “lagging behind”?&lt;/summary&gt;&lt;div&gt;Il ritardo dei Paesi in cui crescita, industrializzazione, differenziazione sociale, democratizzazione e redistribuzione non sono avvenuti (del tutto) come in Occidente e in Asia orientale. Per lui la teoria dello sviluppo deve spiegare questo ritardo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché è problematico dire “nessuno è contro lo sviluppo”?&lt;/summary&gt;&lt;div&gt;Perché il consenso generico nasconde i conflitti di potere. Si finanziano facilmente progetti tecnici, ma non iniziative che mettono in discussione privilegi e stanno dalla parte dei gruppi oppressi.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che cos’è l’ethnocentrism applicato allo sviluppo?&lt;/summary&gt;&lt;div&gt;Usare la propria società (qui l’Europa/Occidente) come modello e metro di giudizio per tutte le altre.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 7 --&gt;
&lt;section class=&quot;part brick&quot; id=&quot;s7&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;07&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;La svolta&lt;/div&gt;&lt;h2&gt;Inequality nel dibattito sullo sviluppo: un paradigm change&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; slide 23–27: tre strategie, “A paradigm change”, “Reduce inequality / Ensure equity”, “Promote inclusion”, “Universal development goals”.&lt;/p&gt;
&lt;div class=&quot;narrow&quot;&gt;&lt;p&gt;Se il concetto di sviluppo ha questi limiti, come lo si corregge mettendo al centro la &lt;b&gt;disuguaglianza&lt;/b&gt;? Le slide, seguendo Freistein &amp;amp; Mahlert, propongono tre strade.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Tre strategie&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;r1&quot;&gt;1 · Radical break&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;r2&quot;&gt;2 · Smooth incorporation&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;r3&quot;&gt;3 · Fundamental reforms&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot; role=&quot;tabpanel&quot; id=&quot;r1&quot;&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; role=&quot;img&quot; aria-label=&quot;Radical break: development sostituito da inequality&quot;&gt;&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;40&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--muted)&quot; stroke-dasharray=&quot;4 3&quot;/&gt;&lt;text x=&quot;130&quot; y=&quot;70&quot; fill=&quot;var(--muted)&quot; text-decoration=&quot;line-through&quot;&gt;development&lt;/text&gt;&lt;path d=&quot;M230 65 H360&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;rect x=&quot;370&quot; y=&quot;35&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;465&quot; y=&quot;70&quot; fill=&quot;var(--ink)&quot;&gt;inequality&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;&lt;b&gt;Sostituire&lt;/b&gt; del tutto “development” con i temi della disuguaglianza. Per le slide è &lt;b&gt;improbabile, troppo radicale&lt;/b&gt;: il vocabolario dello sviluppo è troppo radicato nelle istituzioni.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot; role=&quot;tabpanel&quot; id=&quot;r2&quot; hidden&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; role=&quot;img&quot; aria-label=&quot;Smooth incorporation: inequality aggiunta a development&quot;&gt;&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;150&quot; y=&quot;25&quot; width=&quot;300&quot; height=&quot;80&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;58&quot; fill=&quot;var(--ink)&quot;&gt;development (approccio istituzionale)&lt;/text&gt;&lt;rect x=&quot;235&quot; y=&quot;68&quot; width=&quot;130&quot; height=&quot;28&quot; rx=&quot;8&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;87&quot; font-size=&quot;12.5&quot; fill=&quot;var(--ink)&quot;&gt;+ inequality&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;Si &lt;b&gt;modificano le pratiche&lt;/b&gt; aggiungendo attenzione alle disuguaglianze, ma si &lt;b&gt;mantiene&lt;/b&gt; l’approccio istituzionale tradizionale. La disuguaglianza è un’aggiunta, non cambia la struttura.&lt;/p&gt;
&lt;/div&gt;
&lt;div class=&quot;figure&quot; role=&quot;tabpanel&quot; id=&quot;r3&quot; hidden&gt;
&lt;svg viewBox=&quot;0 0 600 130&quot; role=&quot;img&quot; aria-label=&quot;Fundamental reforms: development riletto attraverso la lente della inequality&quot;&gt;&lt;g font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;&lt;rect x=&quot;60&quot; y=&quot;35&quot; width=&quot;180&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--muted)&quot;/&gt;&lt;text x=&quot;150&quot; y=&quot;70&quot; fill=&quot;var(--ink)&quot;&gt;development&lt;/text&gt;&lt;circle cx=&quot;300&quot; cy=&quot;65&quot; r=&quot;34&quot; fill=&quot;none&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;300&quot; y=&quot;70&quot; font-size=&quot;12&quot; fill=&quot;var(--brick)&quot;&gt;lente&lt;/text&gt;&lt;path d=&quot;M240 65 H262 M338 65 H370&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot;/&gt;&lt;rect x=&quot;372&quot; y=&quot;35&quot; width=&quot;190&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;467&quot; y=&quot;62&quot; fill=&quot;var(--ink)&quot;&gt;development&lt;/text&gt;&lt;text x=&quot;467&quot; y=&quot;80&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;tradotto in chiave equità&lt;/text&gt;&lt;/g&gt;&lt;/svg&gt;
&lt;p&gt;Né rottura né semplice aggiunta: si &lt;b&gt;riformano&lt;/b&gt; gli impegni di sviluppo &lt;b&gt;traducendoli&lt;/b&gt; dalla prospettiva della disuguaglianza. È la strada che, secondo Freistein &amp;amp; Mahlert, gli SDGs rendono possibile.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;

&lt;h3&gt;Il paradigm change: inequality dentro gli SDGs&lt;/h3&gt;
&lt;p&gt;Con gli SDGs la disuguaglianza è &lt;b&gt;integrata sistematicamente&lt;/b&gt;: secondo la slide 24, &lt;b&gt;11 dei 17 goals&lt;/b&gt; affrontano forme di disuguaglianza, in termini di riduzione delle disuguaglianze / equità, di accesso alle opportunità o di inclusione.&lt;/p&gt;
&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Reduce inequality / Ensure equity&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Goals &lt;b&gt;1, 3, 4, 5, 6, 7, 10&lt;/b&gt;. Parole chiave: “for all”, “in all its forms”, “inclusive and equitable”, &lt;i&gt;availability&lt;/i&gt;, &lt;i&gt;access&lt;/i&gt;. Il &lt;b&gt;Goal 10&lt;/b&gt; è l’unico dedicato esplicitamente alla disuguaglianza, “within and among countries”, cioè sia dentro i Paesi sia tra Paesi.&lt;/p&gt;&lt;/div&gt;
&lt;div class=&quot;card tint&quot;&gt;&lt;h4&gt;Promote inclusion&lt;/h4&gt;&lt;p class=&quot;small&quot;&gt;Goals &lt;b&gt;8, 9, 11, 16, 17&lt;/b&gt;. Parole chiave: crescita “inclusive”, industrializzazione “inclusive”, città “inclusive, safe, resilient”, società e istituzioni “inclusive”, partenariato globale.&lt;/p&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;nota&lt;/span&gt; Attenzione: le slide 25–26 elencano in tutto &lt;b&gt;12&lt;/b&gt; goals (7 + 5), mentre la slide 24 parla di &lt;b&gt;11&lt;/b&gt;. Controlla il conteggio sul testo di Freistein &amp;amp; Mahlert o chiedi a lezione quale goal viene escluso. Anche l’anno è indicato in due modi: “2015” a slide 23, “2016” nella lista dei materiali (l’articolo è in &lt;i&gt;Third World Quarterly&lt;/i&gt; 37(12), 2016).&lt;/p&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;svg viewBox=&quot;0 0 900 120&quot; role=&quot;img&quot; aria-label=&quot;Barra dei 17 goals colorata per gruppo&quot; id=&quot;sdgbar&quot;&gt;&lt;/svg&gt;
&lt;figcaption&gt;I 17 goals per gruppo nelle slide 25–26: mattone = equity, ardesia = inclusion, grigio = non elencati (2, 12, 13, 14, 15, tutti ambientali o sul cibo).&lt;/figcaption&gt;
&lt;/div&gt;

&lt;h3&gt;Universal development goals&lt;/h3&gt;
&lt;p&gt;Il cambiamento più profondo: gli SDGs sono &lt;b&gt;universali&lt;/b&gt;, “pertaining to all countries (and individuals) alike”. Confronta i due modelli.&lt;/p&gt;
&lt;div class=&quot;figure&quot;&gt;
&lt;div class=&quot;row&quot; role=&quot;group&quot; aria-label=&quot;Modello&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;u-old&quot; aria-pressed=&quot;true&quot;&gt;Vecchio modello&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;u-new&quot; aria-pressed=&quot;false&quot;&gt;Modello SDGs&lt;/button&gt;&lt;/div&gt;
&lt;svg viewBox=&quot;0 0 900 260&quot; role=&quot;img&quot; aria-label=&quot;Confronto tra modello gerarchico Nord-Sud e modello universale&quot; id=&quot;univ&quot;&gt;
&lt;g id=&quot;u-oldg&quot;&gt;
&lt;rect x=&quot;300&quot; y=&quot;20&quot; width=&quot;300&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;47&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; fill=&quot;var(--ink)&quot;&gt;Global North · “developed”&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;66&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;problemi propri invisibili&lt;/text&gt;
&lt;path d=&quot;M450 82 V160&quot; stroke=&quot;var(--brick)&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ah)&quot;/&gt;&lt;text x=&quot;470&quot; y=&quot;125&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;aiuto, modelli, progetti&lt;/text&gt;
&lt;rect x=&quot;250&quot; y=&quot;165&quot; width=&quot;400&quot; height=&quot;60&quot; rx=&quot;10&quot; fill=&quot;var(--brick-bg)&quot; stroke=&quot;var(--brick)&quot;/&gt;&lt;text x=&quot;450&quot; y=&quot;192&quot; text-anchor=&quot;middle&quot; font-size=&quot;15&quot; fill=&quot;var(--ink)&quot;&gt;Global South · “developing / less developed”&lt;/text&gt;&lt;text x=&quot;450&quot; y=&quot;211&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot;&gt;“inferior world-societal status”&lt;/text&gt;
&lt;/g&gt;
&lt;g id=&quot;u-newg&quot; style=&quot;display:none&quot;&gt;
&lt;circle cx=&quot;450&quot; cy=&quot;130&quot; r=&quot;110&quot; fill=&quot;var(--slate-bg)&quot; stroke=&quot;var(--slate)&quot;/&gt;
&lt;text x=&quot;450&quot; y=&quot;60&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; fill=&quot;var(--slate)&quot;&gt;gli stessi 17 goals per tutti&lt;/text&gt;
&lt;g font-size=&quot;12.5&quot; text-anchor=&quot;middle&quot; fill=&quot;var(--ink)&quot;&gt;
&lt;circle cx=&quot;390&quot; cy=&quot;110&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;390&quot; y=&quot;114&quot;&gt;Italia&lt;/text&gt;
&lt;circle cx=&quot;510&quot; cy=&quot;110&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;114&quot;&gt;Nigeria&lt;/text&gt;
&lt;circle cx=&quot;390&quot; cy=&quot;180&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;390&quot; y=&quot;184&quot;&gt;USA&lt;/text&gt;
&lt;circle cx=&quot;510&quot; cy=&quot;180&quot; r=&quot;30&quot; fill=&quot;var(--card)&quot; stroke=&quot;var(--rule)&quot;/&gt;&lt;text x=&quot;510&quot; y=&quot;184&quot;&gt;India&lt;/text&gt;
&lt;/g&gt;
&lt;text x=&quot;620&quot; y=&quot;120&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;“inclusive”, “equitable”, “for all”,&lt;/text&gt;&lt;text x=&quot;620&quot; y=&quot;138&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;“in all its forms”&lt;/text&gt;
&lt;text x=&quot;110&quot; y=&quot;120&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;anche il Nord ha problemi&lt;/text&gt;&lt;text x=&quot;110&quot; y=&quot;138&quot; font-size=&quot;12.5&quot; fill=&quot;var(--muted)&quot;&gt;di sviluppo (es. obesità, disuguaglianza)&lt;/text&gt;
&lt;/g&gt;
&lt;/svg&gt;
&lt;/div&gt;
&lt;ul class=&quot;tick&quot;&gt;
&lt;li&gt;La semantica di “inclusive”, “equitable”, “equal”, “by/for all”, “in all its forms” segna una &lt;b&gt;svolta verso l’uguaglianza&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;Tutti i goals che riguardano risultati individuali (istruzione, povertà, cibo, salute, igiene, energia, crescita, infrastrutture urbane) sono formulati per essere &lt;b&gt;inclusive o equitable&lt;/b&gt;.&lt;/li&gt;
&lt;li&gt;È un passo importante per superare la tendenza coloniale ad assegnare ai Paesi del Sud globale un &lt;b&gt;“inferior world-societal status”&lt;/b&gt;, una tendenza che nascondeva anche i problemi di sviluppo di lunga data nel Nord globale ricco.&lt;/li&gt;
&lt;/ul&gt;

&lt;div class=&quot;quiz&quot;&gt;&lt;h3&gt;Autoverifica · inequality e SDGs&lt;/h3&gt;
&lt;details&gt;&lt;summary&gt;Descrivi le tre strategie per includere la disuguaglianza nel dibattito sullo sviluppo.&lt;/summary&gt;&lt;div&gt;(1) &lt;b&gt;Radical break&lt;/b&gt;: sostituire “development” con “inequality”, improbabile e troppo radicale. (2) &lt;b&gt;Smooth incorporation&lt;/b&gt;: aggiungere attenzione alla disuguaglianza mantenendo l’approccio istituzionale tradizionale. (3) &lt;b&gt;Fundamental reforms&lt;/b&gt;: tradurre gli impegni di sviluppo dalla prospettiva della disuguaglianza (Freistein &amp;amp; Mahlert).&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Qual è l’unico goal dedicato esplicitamente alla disuguaglianza e cosa significa “within and among countries”?&lt;/summary&gt;&lt;div&gt;Il Goal 10. “Within” indica le disuguaglianze dentro ogni Paese (tra ricchi e poveri, uomini e donne…), “among” quelle tra Paesi.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Perché l’universalità degli SDGs è una rottura con il passato coloniale?&lt;/summary&gt;&lt;div&gt;Perché gli obiettivi valgono per tutti i Paesi e tutte le persone: il Sud non è più collocato in una posizione inferiore da “far sviluppare”, e il Nord deve riconoscere i propri problemi di sviluppo.&lt;/div&gt;&lt;/details&gt;
&lt;details&gt;&lt;summary&gt;Che differenza c’è tra “availability” (Goal 6) e “access” (Goal 7)?&lt;/summary&gt;&lt;div&gt;Disponibilità: la risorsa esiste ed è gestita in modo sostenibile. Accesso: le persone riescono effettivamente a ottenerla (costo, distanza, discriminazioni). La disuguaglianza si annida spesso nello scarto tra le due.&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;!-- 8 --&gt;
&lt;section class=&quot;part&quot; id=&quot;s8&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;08&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Il quadro&lt;/div&gt;&lt;h2&gt;Collegamenti con il resto del modulo&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;src&quot;&gt;&lt;span class=&quot;badge b-slide&quot;&gt;slide&lt;/span&gt; programma a slide 3 e materiali a slide 4 di questa lezione.&lt;/p&gt;
&lt;p&gt;I concetti di oggi sono gli attrezzi per le lezioni successive. Clicca un tema per vedere quale idea di oggi ti servirà.&lt;/p&gt;
&lt;div class=&quot;tabs&quot;&gt;
&lt;div role=&quot;tablist&quot; aria-label=&quot;Collegamenti&quot;&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;true&quot; aria-controls=&quot;c1&quot;&gt;Differenze sociali&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c2&quot;&gt;Demografia&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c3&quot;&gt;Genere&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c4&quot;&gt;Povertà&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c5&quot;&gt;Migrazioni&lt;/button&gt;
&lt;button class=&quot;btn&quot; role=&quot;tab&quot; aria-selected=&quot;false&quot; aria-controls=&quot;c6&quot;&gt;Valori&lt;/button&gt;
&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c1&quot;&gt;&lt;b&gt;Unequal access to opportunities.&lt;/b&gt; Riprende la prospettiva sociologica (posizione nella società) e il lessico “access / inclusion” dei goals 6–7–8–11. Goal 10 “within and among countries”.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c2&quot; hidden&gt;&lt;b&gt;Intergenerational conflicts.&lt;/b&gt; Riprende l’idea di sviluppo “now and into the future” dell’Agenda 2030 e il Goal 3 “for all at all ages”.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c3&quot; hidden&gt;&lt;b&gt;Gender inequalities.&lt;/b&gt; Goal 5. Lettura: Kabeer (2015). Applica la critica allo sviluppo: anche i modelli “neutri” di povertà possono nascondere le differenze di genere.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c4&quot; hidden&gt;&lt;b&gt;Poverty, stratification, mobility.&lt;/b&gt; Goals 1 e 8. Riprende la discussione GNP vs HDI e la critica alla crescita come unico obiettivo dello sviluppo.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c5&quot; hidden&gt;&lt;b&gt;Environmental migration.&lt;/b&gt; “Refugee crisis” e “migration” sono tra i social problems (slide 15); il clima collega alla sezione 4. Lettura: Nijenhuis &amp;amp; Leung (2017), sviluppo de-territorializzato.&lt;/div&gt;
&lt;div class=&quot;card&quot; role=&quot;tabpanel&quot; id=&quot;c6&quot; hidden&gt;&lt;b&gt;Values, solidarity, cohesion.&lt;/b&gt; Nella definizione di social problem servono valori condivisi (slide 13); anche la “collective vs individual responsibility” di slide 2. Lettura: Horlings (2015).&lt;/div&gt;
&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;&lt;span class=&quot;badge b-note&quot;&gt;nota&lt;/span&gt; I collegamenti si basano sul programma della slide 3. Gli altri file della cartella &lt;code&gt;corso/&lt;/code&gt; non erano consultabili con gli strumenti di questa sessione, quindi qui non ne è stato usato nessuno.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;
