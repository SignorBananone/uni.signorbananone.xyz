&lt;section class=&quot;part refs&quot; id=&quot;fonti&quot;&gt;
&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;part-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;↗&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;kicker&quot;&gt;Fonti esterne&lt;/div&gt;&lt;h2&gt;Per approfondire&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p&gt;Ogni scheda riguarda un autore, un testo o un sito citato nelle slide. Le descrizioni vengono da ricerche web: sono &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt; e non contenuto della lezione.&lt;/p&gt;

&lt;h3&gt;Letture d’esame (slide 4)&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Freistein, K. &amp;amp; Mahlert, B. (2016). The potential for tackling inequality in the Sustainable Development Goals&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Third World Quarterly&lt;/i&gt;, 37(12), 2139–2155. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: l’analisi degli obiettivi espliciti e impliciti sulla disuguaglianza negli SDGs. Gli SDGs vanno molto oltre gli obiettivi precedenti nel trattarla come questione centrale, anche se con formulazioni vaghe. Gli autori si chiedono se possano diventare “risorse discorsive” per riforme di fondo delle idee di sviluppo. &lt;b&gt;Perché conta:&lt;/b&gt; è la base delle sezioni 6–7 (tre strategie, fundamental reforms).&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1080/01436597.2016.1166945&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI editore&lt;/a&gt; · &lt;a href=&quot;https://ideas.repec.org/a/taf/ctwqxx/v37y2016i12p2139-2155.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;abstract su IDEAS/RePEc&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Kabeer, N. (2015). Gender, poverty, and inequality: a brief history of feminist contributions in the field of international development&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Gender &amp;amp; Development&lt;/i&gt;, 23(2), 189–205. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: una rassegna del lavoro femminista su genere, povertà e disuguaglianza negli studi sullo sviluppo, dal livello micro a quello macro, con le confusioni ancora aperte tra i tre concetti. &lt;b&gt;Perché conta:&lt;/b&gt; prepara la lezione sulle gender inequalities e mostra un limite delle misure “neutre” di povertà, che trattano la famiglia come un’unità.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1080/13552074.2015.1062300&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI editore&lt;/a&gt; · &lt;a href=&quot;https://policy-practice.oxfam.org/resources/gender-poverty-and-inequality-a-brief-history-of-feminist-contributions-in-the-560889/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;copia su Oxfam Policy &amp;amp; Practice&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Nijenhuis, G. &amp;amp; Leung, M. (2017). Rethinking Migration in the 2030 Agenda: Towards a De-Territorialized Conceptualization of Development&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Forum for Development Studies&lt;/i&gt;, 44(1), 51–68. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: un’analisi di come l’Agenda 2030 tratta la migrazione, quasi assente nei MDGs. La tesi è che l’Agenda resta legata a una visione “per luoghi” (place-based) dello sviluppo e non coglie la natura translocale dell’economia globale. &lt;b&gt;Perché conta:&lt;/b&gt; applica la critica al concetto di development (sezione 6) al tema delle migrazioni.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1080/08039410.2016.1276958&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI editore&lt;/a&gt; · &lt;a href=&quot;https://research-portal.uu.nl/en/publications/rethinking-migration-in-the-2030-agenda-towards-a-de-territoriali/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Utrecht University research portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Horlings, L. G. (2015). The inner dimension of sustainability: Personal and cultural values&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;&lt;i&gt;Current Opinion in Environmental Sustainability&lt;/i&gt;, 14, 163–169. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: la tesi che la trasformazione verso la sostenibilità richiede un cambiamento di valori, la sua “inner dimension”. Distingue tra valori personali e valori culturali collettivi e si chiede come i valori differiscano da credenze, atteggiamenti e visioni del mondo. &lt;b&gt;Perché conta:&lt;/b&gt; base per la lezione su human values e per la tensione individuale/collettivo.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://doi.org/10.1016/j.cosust.2015.06.006&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;DOI editore&lt;/a&gt; · &lt;a href=&quot;https://research.rug.nl/en/publications/the-inner-dimension-of-sustainability-personal-and-cultural-value/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;University of Groningen research portal&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Video «Mapping Planetary AI» · Kate Crawford&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;State Library Victoria, lezione “For Future Reference”, 5 dicembre 2024. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: una conversazione con Kate Crawford, autrice di &lt;i&gt;Atlas of AI&lt;/i&gt;, sulle infrastrutture dell’intelligenza artificiale e sugli “imperi tecnologici” che la producono. Sul sito della biblioteca c’è una trascrizione. &lt;b&gt;Perché conta:&lt;/b&gt; mostra la tecnologia come fenomeno sociale e materiale, legato a potere, lavoro e ambiente, cioè la prospettiva sociologica applicata a un tema attuale.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.youtube.com/watch?v=0PqrZ2lqT70&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;YouTube&lt;/a&gt; · &lt;a href=&quot;https://lab.slv.vic.gov.au/experiments/ai-ethics-policy-research/mapping-planetary-ai-kate-crawford&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;trascrizione SLV&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Autori e testi citati&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;C. Wright Mills (1959). The Sociological Imagination&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Oxford University Press. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: la distinzione tra &lt;i&gt;personal troubles&lt;/i&gt;, che stanno nel carattere della persona e nelle sue relazioni immediate, e &lt;i&gt;public issues&lt;/i&gt;, che riguardano l’organizzazione delle istituzioni e della struttura sociale. Il compito del sociologo è collegare biografia e storia. &lt;b&gt;Perché conta:&lt;/b&gt; è il fondamento delle sezioni 2–3.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://csus.edu/indiv/m/monkd/sociological_imagination.html&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Estratto commentato (California State University, Sacramento)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;W. W. Rostow (1960). The Stages of Economic Growth: A Non-Communist Manifesto&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Cambridge University Press. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: i cinque stadi, dalla società tradizionale al consumo di massa. I critici hanno definito gli stadi “empty boxes”, difficili da verificare empiricamente. &lt;b&gt;Perché conta:&lt;/b&gt; è l’esempio classico della visione evolutiva e occidentalocentrica dello sviluppo criticata a slide 20–22.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://www.cambridge.org/core/books/the-stages-of-economic-growth/9CB46055035A1915509CE15A57848A07&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambridge Core&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Bernstein, citato da Thomas &amp;amp; Potter (1992)&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;A. Thomas &amp;amp; D. Potter, “Development, capitalism and the nation state”, in T. Allen &amp;amp; A. Thomas (eds.), &lt;i&gt;Poverty and Development in the 1990s&lt;/i&gt;, Oxford University Press / Open University, 1992. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: un manuale dell’Open University sullo sviluppo, nella sezione sulla formazione del “Terzo Mondo”. Henry Bernstein firma nell’edizione successiva il capitolo “Colonialism, capitalism, development”. &lt;b&gt;Perché conta:&lt;/b&gt; è la fonte della formula “following in the footsteps of the West” (p. 119). Il riferimento esatto alla pagina non è stato verificato online.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://researchonline.lse.ac.uk/id/eprint/8049&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Scheda LSE dell’edizione 2000 (che riprende quella del 1992)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Ulrich Menzel · Das Ende der Dritten Welt und das Scheitern der großen Theorie (1992)&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Suhrkamp, Frankfurt am Main. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: la tesi che il “Terzo Mondo” sia una categoria costruita e che le grandi teorie dello sviluppo (modernizzazione e dipendenza) abbiano perso capacità esplicativa. Menzel non nega l’esistenza di problemi di sviluppo. &lt;b&gt;Perché conta:&lt;/b&gt; le slide citano la sua definizione di sviluppo e l’idea di “lagging behind”. La slide non indica quale opera viene citata.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/Ulrich_Menzel&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce Wikipedia (bibliografia)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;h3&gt;Istituzioni, indici e dati&lt;/h3&gt;
&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;ONU · Agenda 2030 e sdgs.un.org&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Risoluzione A/RES/70/1, “Transforming our world: the 2030 Agenda for Sustainable Development” (2015). &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: la dichiarazione, i 17 goals e i 169 targets, i principi di universalità e “leave no one behind”. &lt;b&gt;Perché conta:&lt;/b&gt; è il testo originale da cui le slide citano i goals.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://sdgs.un.org/goals&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;sdgs.un.org/goals&lt;/a&gt; · &lt;a href=&quot;https://documents.un.org/Doc/Undoc/Gen/N15/291/89/Pdf/N1529189.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;testo della risoluzione&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;UNDP · Human Development Index&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Human Development Report Office. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: le note tecniche con le tre dimensioni (salute, conoscenza, reddito), le soglie e la media geometrica. &lt;b&gt;Perché conta:&lt;/b&gt; è lo strumento che segna il passaggio dalla crescita allo sviluppo umano (slide 20). Il calcolatore della sezione 6 si basa su queste note.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://hdr.undp.org/sites/default/files/2025_HDR/HDR25_Technical_Notes.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;HDR 2025 Technical Notes&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;World Bank · World Development Report&lt;/h4&gt;
&lt;p class=&quot;small&quot;&gt;Rapporto annuale dal 1978. &lt;span class=&quot;badge b-ext&quot;&gt;fonte esterna&lt;/span&gt;&lt;/p&gt;
&lt;p class=&quot;why&quot;&gt;Contiene: ogni anno un tema centrale per lo sviluppo (povertà, equità, ruolo dello Stato, ambiente…). Il primo numero si intitolava “Prospects for Growth and Alleviation of Poverty”. &lt;b&gt;Perché conta:&lt;/b&gt; è l’esempio delle slide di sviluppo misurato con il GNP.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;&lt;a href=&quot;https://en.wikipedia.org/wiki/World_Development_Report&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Voce Wikipedia&lt;/a&gt; · &lt;a href=&quot;https://www.worldbank.org/wdr&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;worldbank.org/wdr&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;

&lt;div class=&quot;card&quot;&gt;&lt;h4&gt;WHO · Overweight and obesity (WHO, 2016b)&lt;/h4&gt;

$(&quot;#u-old&quot;).addEventListener(&quot;click&quot;,function(){univ(0)});$(&quot;#u-new&quot;).addEventListener(&quot;click&quot;,function(){univ(1)});
